// Safari's own pinch on a trackpad
let gestureZ = 1;
canvas.addEventListener('gesturestart', e => { e.preventDefault(); gestureZ = view.z; });
canvas.addEventListener('gesturechange', e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  zoomAt(e.clientX - r.left, e.clientY - r.top, (gestureZ * e.scale) / view.z);
});

document.addEventListener('keydown', e => {
  if (window.Proto && Proto.isOpen()) return;
  if (e.target.closest && e.target.closest('input, textarea, select')) return;
  if (e.metaKey || e.altKey) return;
  const k = e.key;
  if (e.code === 'Space') { spaceDown = true; canvas.classList.add('space'); e.preventDefault(); return; }
  if (e.ctrlKey) {
    if (k === '0') { zoom100(); e.preventDefault(); }
    else if (k === '=' || k === '+') { zoomCentre(1.25); e.preventDefault(); }
    else if (k === '-') { zoomCentre(0.8); e.preventDefault(); }
    return;
  }
  if (e.shiftKey && e.code === 'Digit1') fitPage();
  else if (e.shiftKey && e.code === 'Digit2') { if (sel) zoomToFrame(sel); else fitPage(); }
  else if (e.shiftKey && e.code === 'Digit0') zoom100();
  else if (k === '+' || k === '=') zoomCentre(1.25);
  else if (k === '-' || k === '_') zoomCentre(0.8);
  else if (k === 'v' || k === 'V') setTool('move');
  else if (k === 'h' || k === 'H') setTool('hand');
  else if (k === 'n') stepFrame(1);
  else if (k === 'N') stepFrame(-1);
  else if (k === 'PageDown') stepPage(1);
  else if (k === 'PageUp') stepPage(-1);
  else if (k === 'm' || k === 'M') setMode(mode === 'dark' ? 'light' : 'dark');
  else if (k === '?') $('#help').hidden = !$('#help').hidden;
  else if (k === 'Enter' && sel) zoomToFrame(sel);
  else if (k === 'Escape') { if (!$('#help').hidden) $('#help').hidden = true; else if (app.classList.contains('show-left') || app.classList.contains('show-right')) drawer(null); else select(null); }
  else if (k.startsWith('Arrow')) {
    const step = e.shiftKey ? 240 : 60;
    view.x += k === 'ArrowLeft' ? step : k === 'ArrowRight' ? -step : 0;
    view.y += k === 'ArrowUp' ? step : k === 'ArrowDown' ? -step : 0;
    apply();
  } else return;
  e.preventDefault();
});
document.addEventListener('keyup', e => { if (e.code === 'Space') { spaceDown = false; canvas.classList.remove('space'); } });

document.addEventListener('click', e => {
  const b = e.target.closest('button, [data-mode]');
  if (!b) return;
  if (b.dataset.page) { renderPage(b.dataset.page); drawer(null); }
  else if (b.dataset.id && b.classList.contains('lrow')) { select(b.dataset.id, { zoom: true }); drawer(null); }
  else if (b.dataset.mode) setMode(b.dataset.mode);
  else if (b.dataset.tab) { tab = b.dataset.tab; renderInspector(); }
  else if (b.dataset.tool) setTool(b.dataset.tool);
  else if (b.dataset.do) {
    const what = b.dataset.do;
    if (what === 'zoom-in') zoomCentre(1.25);
    else if (what === 'zoom-out') zoomCentre(0.8);
    else if (what === 'fit') fitPage();
    else if (what === 'mode') setMode(mode === 'dark' ? 'light' : 'dark');
    else if (what === 'help') $('#help').hidden = !$('#help').hidden;
    else if (what === 'left') drawer(app.classList.contains('show-left') ? null : 'left');
    else if (what === 'right') drawer(app.classList.contains('show-right') ? null : 'right');
    else if (what === 'present') { drawer(null); Proto.open(); }
  }
});
$('#layers').addEventListener('pointerover', e => { const b = e.target.closest('.lrow'); setHover(b ? b.dataset.id : null); });
$('#layers').addEventListener('pointerleave', () => setHover(null));
$('#scrim').addEventListener('click', () => drawer(null));
window.addEventListener('resize', () => apply());

function boot() {
  $('#help').innerHTML = `<h4>Keyboard and mouse</h4>${keysHTML()}`;
  $('#file-mark').innerHTML = tagIcon(2, 26);
  $('#mode-tool').innerHTML = glyph(mode === 'dark' ? 'sun' : 'moon', 'currentColor', 18);
  $$('[data-mode]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));

  renderPage(PAGES.some(x => x.id === p) ? p : 'cover', { select: f || null });
  if (p === 'present') Proto.open();  // a link straight to the prototype
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => {
      measure();
      buildOverlay();
      if (!touched) { if (sel) zoomToFrame(sel, false); else fitPage(false); }

  }

  function clock(t) {
    const d = new Date(t), today = new Date();
    const hm = `${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`;
    return d.toDateString() === today.toDateString() ? hm : `tomorrow at ${hm}`;
  }
  const length = min => {
    const h = Math.floor(min / 60), m = min % 60;
    return [h ? `${h} hour${h > 1 ? 's' : ''}` : '', m ? `${m} min` : ''].filter(Boolean).join(' ');
  };
  function at(h, m) {
    const d = new Date();
    d.setHours(h, m, 0, 0);
    if (d.getTime() <= now()) d.setDate(d.getDate() + 1);
    return d.getTime();
  }
  // What a break typed in words means: a while ("45", "1h30") or a time ("4pm", "15h30", "noon").
  function parseBreak(text) {
    let t = text.toLowerCase().trim().replace(/\s+/g, ' ');
    if (!t) return null;
    if (t === 'tomorrow' || t === 'until tomorrow') { const d = new Date(); d.setDate(d.getDate() + 1); d.setHours(9, 0, 0, 0); return { until: d.getTime(), said: 'A break until ' + clock(d.getTime()) }; }
    let until = /^(until|till|to) /.test(t);
    const forced = /^for /.test(t);
    t = t.replace(/^(until|till|to|for) /, '');
    if (t === 'noon') { const u = at(12, 0); return { until: u, said: 'A break until ' + clock(u) }; }
    let m = t.match(/^(\d{1,2})(?::(\d{2}))? ?(am|pm)$/);

    m = t.match(/^(\d{1,2})(?:[:h](\d{2}))$/) || (until && t.match(/^(\d{1,2})h?()$/));
    if (m && !forced) { const u = at(+m[1], +(m[2] || 0)); return { until: u, said: 'A break until ' + clock(u) }; }

    if (m) {

      if (h >= 9 && !forced && !m[2]) { const u = at(h, 0); return { until: u, said: 'A break until ' + clock(u) }; }

      if (!min) return null;
      return { until: now() + min * 60000, said: `A break of ${length(min)}, back at ${clock(now() + min * 60000)}` };
    }
    m = t.match(/^(\d{1,3}) ?(?:m|min|mins|minutes?)?$/);
    if (m && +m[1] > 0) { const min = +m[1]; return { until: now() + min * 60000, said: `A break of ${length(min)}, back at ${clock(now() + min * 60000)}` }; }
    return null;
  }
  const previewBreak = text => {
    if (!text.trim()) return { ok: false, text: '' };
    const b = parseBreak(text);
    return b ? { ok: true, text: b.said + '.' } : { ok: false, text: 'I don’t follow. Try 1h30, 45 min, 4:45pm or noon.' };
  };

  // --- Typed commands (tagnan/ui/menu.py, suggest) ----------------------------------------------
  const words = s => s.toLowerCase().split(/\s+/).filter(Boolean).join(' ').replace(/[ .!?]+$/, '');
  function after(text, list) {
    const folded = words(text);
    for (const w of [...list].sort((a, b) => b.length - a.length)) {
      if (folded === w) return '';
      if (folded.startsWith(w + ' ')) return text.trim().split(/\s+/).join(' ').slice(w.length + 1).trim();
    }
    return null;
  }
  function knownCourse(text) { const w = words(text); return S.courses.find(c => words(c.label) === w || c.key === w); }
  function previewCourse(text) {
    const said = text.trim().split(/\s+/).join(' ');
    if (!said) return { ok: false, text: '' };
    const known = knownCourse(said);
    if (known) return { ok: true, text: `Back to ${known.label}.` };
    if (said.length > 120) return { ok: false, text: 'Shorter, please: 120 characters at most.' };
    return { ok: true, text: 'I’ll draw up a course on it: a minute or two.' };
  }
  const previewSubject = text => text.trim() ? { ok: true, text: `Questions on ${text.trim()}.` } : { ok: false, text: '' };
  function suggest(text) {
    const folded = words(text);
    if (!folded) return [];
    const found = [];
    const add = (label, action, sub = '') => { if (!found.some(f => f.action === action)) found.push({ label, sub, action }); };
    let rest = after(text, ['break', 'pause', 'a break', 'rest']);
    const b = parseBreak(rest ? rest : text);
    if (b && (rest || rest === null)) { const [said, back] = b.said.split(', '); add(said, 'pause:' + (rest || text), back ? back[0].toUpperCase() + back.slice(1) : ''); }
    rest = after(text, ['learn', 'study']);
    if (rest) add(`Learn ${rest}`, 'learn:' + rest, previewCourse(rest).text);
    rest = after(text, ['subject', 'focus', 'on']);
    if (rest) add(`Questions on ${rest}`, 'focus:' + rest, `Questions on ${rest}.`);
    for (const [action, label, list] of COMMANDS) {
      if ((action === 'resume' && !paused()) || (action === 'update' && S.update === 'busy')) continue;
      if ([label.toLowerCase(), ...list].some(w => w.startsWith(folded) || w.includes(folded))) add(label, action);
    }
    let all = ['how often', 'pace', 'rhythm', 'frequency'].includes(folded);
    for (const p of [...PACES].sort((x, y) => y.name.toLowerCase().startsWith(folded) - x.name.toLowerCase().startsWith(folded))) {
      if (all || p.name.toLowerCase().startsWith(folded) || p.key.includes(folded)) add(`How often: ${p.name}`, 'pace:' + p.key, p.hint);
    }
    all = ['sound', 'sounds', 'call', 'music'].includes(folded);
    for (const c of CALLS) if (all || c.name.toLowerCase().startsWith(folded) || ['mute', 'quiet'].includes(folded)) add(`Sound: ${c.name}`, 'call:' + c.key);
    for (const [key, names] of Object.entries(THEME_WORDS)) if (folded.length > 2 && names.some(w => w.startsWith(folded))) add(`${cap(key)} mode`, 'theme:' + key);
    all = ['model', 'models', 'brain', 'claude', 'questions by'].includes(folded);
    for (const m of MODELS) { const short = m.name.split(',')[0]; if (all || short.toLowerCase().startsWith(folded)) add(`Questions by ${short}`, 'model:' + m.key, m.hint); }
    return found.slice(0, 6);
  }

  // --- What the menu and the bubbles show -------------------------------------------------------
  function menuContent() {
    const g = S.stage, next = GRADES[g + 1], start = GRADES[g].threshold;
    let points = next ? `${S.points} of ${next.threshold} points to ${next.name}` : `${S.points} points · the highest grade`;
    if (S.streak > 1) points += ` · streak ${S.streak}`;
    const pace = PACES.find(p => p.key === S.pace), call = CALLS.find(c => c.key === S.call), model = MODELS.find(m => m.key === S.model);
    const update = S.update === 'busy' ? { label: 'Updating…', value: 'back in a moment', pill: false, busy: true, strong: false }
      : S.update === 'new' ? UPDATE_NEW : { label: 'Update & Restart', value: '', pill: false, busy: false, strong: false };
    return {
      stage: g, grade: GRADES[g].name, share: next ? clamp((S.points - start) / (next.threshold - start), 0, 1) : 1, points,
      paused: paused(), next: paused() ? `until ${clock(S.pausedUntil)}` : `next ~${clock(S.nextAt)}`,
      subject: S.subject || current().code, pace: pace.name, paceKey: pace.key, call: call.name,
      sound: S.call === 'silent' ? 'Silent' : `${call.name} · ${S.volume} %`, volume: S.volume, callKey: S.call,
      paces: PACES, calls: CALLS, model: model.name.split(',')[0], modelKey: S.model, models: MODELS, update,
    };
  }
  function subjectContent() {
    const c = current();
    const aws = c.key === 'aif-c01';
    const choices = aws ? AIF_CHOICES : [{ label: `All of ${c.label}`, key: '' }, ...(CHAPTERS[c.key] || []).map((n, i) => ({ label: `${i + 1}. ${n}`, key: 'domain:' + (i + 1) }))];
    return {
      mode: 'subject', title: 'What shall we work on?',
      courses: S.courses.filter(x => x.key !== (S.putAway && S.putAway.key)).map(x => ({ label: x.label, key: x.key, removable: x.key !== c.key })),
      course: c.key, putAway: S.putAway ? { key: S.putAway.key, text: `${S.putAway.label} put away. Learn it again and it comes back, progress and all.` } : {},
      within: `Within ${c.label}:`, choices, current: S.subjectKey || '', status: `Now: ${S.subject ? `${S.subject} (${c.code})` : c.label}.`,
    };
  }
  function statsContent() {
    const g = S.stage, next = GRADES[g + 1], start = GRADES[g].threshold;
    return {
      mode: 'stats', title: GRADES[g].name, points: S.points, next: next ? `${next.threshold} for ${next.name}` : 'the highest grade',
      share: next ? clamp((S.points - start) / (next.threshold - start), 0, 1) : 1, streak: `Streak: ${S.streak} · best ${S.best}`,
      answers: `${S.right} right answers out of ${S.answered}`, domains: STATS.domains,
      bank: `${current().label}: 14 new questions in store, 9 to review in all. ${paused() ? `On a break until ${clock(S.pausedUntil)}.` : `Next question around ${clock(S.nextAt)}.`}`,
    };
  }

  // --- Drawing ------------------------------------------------------------------------------------
  const FY = FY_WIN;
  function build() {
    const dark = mode === 'dark';
    stageEl.innerHTML = `<div class="pbox" id="pbox"><div class="screen tg tg-${mode} ${dark ? 'wall-dark' : 'wall-light'}" id="pscreen">`
      + `<div class="live-rays" id="p-rays" style="left:${FX + 75 - 170}px;top:${FY + 100 - 170}px;width:340px;height:340px"></div>`
      + `<div class="onscreen live-fig" id="p-fig" style="left:${FX}px;top:${FY}px" aria-label="Tagnan: click to tease him, right-click for his menu"></div>`
      + `<div class="live-flash" id="p-flash" style="left:${FX + 75 - 210}px;top:${FY + 100 - 210}px;width:420px;height:420px"></div>`
      + `<div class="onscreen" id="p-bubble" style="right:${1440 - (FX + 2)}px;bottom:${900 - (FY + 176 - 64)}px"></div>`
      + '<div class="onscreen" id="p-menu"></div><div id="p-gone"></div><div id="p-bar"></div></div></div>';
    fit();
    renderFig();
    renderBubble(false);
    renderMenu();
    renderBar();
  }
  function fit() {
    const box = $('#pbox');
    if (!box) return;
    const r = stageEl.getBoundingClientRect();
    const cs = getComputedStyle(stageEl);
    const w = r.width - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const h = r.height - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    // Narrow screens see the corner he lives in, not the whole desktop shrunk.
    const crop = w < 900 ? { x: 780, y: 180, w: 660, h: 720 } : { x: 0, y: 0, w: 1440, h: 900 };
    scale = Math.min(w / crop.w, h / crop.h);
    box.style.width = crop.w * scale + 'px';
    box.style.height = crop.h * scale + 'px';
    $('#pscreen').style.transform = `scale(${scale}) translate(${-crop.x}px, ${-crop.y}px)`;
  }
  function renderFig() {
    const el = $('#p-fig');
    if (!el) return;
    el.hidden = S.gone;
    el.classList.toggle('evolving', S.cover);
    el.innerHTML = figure(S.shown ?? S.stage, S.cover ? 'idle' : S.expr);
    $('#p-rays').classList.toggle('on', S.rays);
  }
  function keepFocus(fn) {
    const a = document.activeElement;
    const which = a && a.dataset ? a.dataset.input : null;
    const pos = which && a.selectionStart != null ? a.selectionStart : null;
    fn();
    if (which) {
      const b = $(`[data-input="${which}"]`, stageEl);
      if (b) { b.focus({ preventScroll: true }); if (pos != null && b.setSelectionRange) try { b.setSelectionRange(pos, pos); } catch (e) { /* range input */ } }
    }
  }
  function renderBubble(animate = true) {

    keepFocus(() => {
      el.innerHTML = S.bubble && !S.gone ? bubble(S.bubble, { ...S.ui, live: true }) : '';
      el.classList.toggle('bubble-in', animate && !!S.bubble);
    });
    if (animate && S.bubble && (S.bubble.mode === 'pause' || S.bubble.mode === 'subject')) {
      const f = $(S.bubble.mode === 'pause' ? '#break-field' : '#course-field', el);
      if (f) f.focus({ preventScroll: true });
    }
    renderHint();
  }
  function renderMenu(fresh = false) {
    const el = $('#p-menu');
    if (!el) return;
    keepFocus(() => {
      if (!S.menu) { el.innerHTML = ''; return; }
      const m = S.menu;
      el.style.right = `${1440 - m.at[0]}px`;
      el.style.bottom = `${900 - m.at[1]}px`;
      el.innerHTML = menu(menuContent(), { ...m.ui, live: true, subLeft: true });
      el.classList.toggle('pop-in', fresh);
      el.style.transformOrigin = '100% 100%';
      placeSublists(el);
      // The list beside stays on the screen, above the taskbar (TagnanMenu.qml, subRel).
      const sub = $('.m-subpanel', el), panel = $('.m-panel', el);
      if (sub) {
        const menuTop = m.at[1] - panel.offsetHeight;
        const top = clamp(parseFloat(sub.style.top), 16 - menuTop, 836 - menuTop - sub.offsetHeight);
        sub.style.top = top + 'px';
      }
    });
    if (fresh) { const f = $('#menu-field', el); if (f) f.focus({ preventScroll: true }); }
    renderHint();
  }
  function renderBar() { const el = $('#p-bar'); if (el) el.innerHTML = taskbar(mode === 'dark', S.stage); }
  function renderGone() {
    $('#p-gone').innerHTML = S.gone ? `<div class="onscreen gone" style="right:80px;bottom:160px;width:320px;color:${mode === 'dark' ? '#E7EBF3' : '#1B2232'}"><b>Tagnan has left.</b>`
      + `${action('Bring him back', { primary: true, act: 'comeback' })}</div>` : '';
  }
  function renderHint() {
    let t = 'Click Tagnan to tease him; right-click him for his menu.';
    if (S.gone) t = 'He quit. Bring him back with the button.';
    else if (S.menu) t = 'Rest on How often, Sound or Questions by to open its list, or type a command: “break 45”, “bell”, “dark”.';
    else if (S.bubble && S.bubble.mode === 'question') t = S.bubble.need > 1 ? 'Pick two answers, then Confirm. “Later” puts it off.' : 'Pick an answer. “Later” puts it off ten minutes.';
    else if (S.cover) t = 'A promotion: watch him evolve.';
    else if (T.next && S.waiting) t = `Next question in a few seconds; ${PACES.find(p => p.key === S.pace).hint} for real. ${t}`;
    hintEl.textContent = t;
  }
  function render() { if (!open) return; build(); renderGone(); }

  // --- His moods, his questions -----------------------------------------------------------------
  function mood(expr, ms) {
    S.expr = expr;
    renderFig();
    if (ms) timer('mood', () => { S.expr = S.bubble && S.bubble.mode === 'question' ? 'ask' : 'idle'; renderFig(); }, ms); else stop('mood');
  }
  function show(c, o = {}) {
    stop('hide');
    S.bubble = c;
    S.ui = o.ui || {};
    renderBubble(true);
    if (o.hide) timer('hide', () => { if (!S.held) dismiss(); else timer('hide', dismiss, 2000); }, o.hide);
  }
  function say(title, text, o = {}) { show({ mode: 'message', title, text, ...(o.button ? { button: o.button } : {}) }, { hide: o.hide ?? 7000 }); }
  function scheduleNext(ms = 7000) {
    stop('next');
    if (paused() || S.gone || S.course !== 'aif-c01') return;
    const [a, b] = GAPS[S.pace];
    S.nextAt = now() + (a + Math.random() * (b - a)) * 60000;
    S.waiting = true;
    // Not while his menu is open: the question waits until it closes.
    timer('next', () => { S.waiting = false; if (!S.menu && (!S.bubble || S.bubble.mode === 'quip')) ask(true); else scheduleNext(); }, ms);
    renderHint();
  }
  function ask(onItsOwn) {
    if (S.gone) return;
    if (S.course !== 'aif-c01') { say('Not yet', `My brain is writing questions on ${current().label}. Come back in a few minutes.`, { hide: 6000 }); return; }
    const d = DECK[S.qi % DECK.length];
    stop('next');
    S.waiting = false;
    S.cur = d;
    show({ ...d.q, title: S.qi === 0 ? d.q.title : pick(ASKS) }, { ui: { picked: [] } });
    mood('ask');
    timer('unanswered', () => { if (S.bubble && S.bubble.mode === 'question') close(); }, 10 * 60000);
    if (onItsOwn) play(S.call);
  }
  function answer(picked) {
    const d = S.cur;
    stop('unanswered');
    const right = picked.length === d.answers.length && picked.every(i => d.answers.includes(i));
    let delta;
    if (right) { S.streak += 1; delta = 10 + Math.min(S.streak - 1, 5); S.right += 1; S.best = Math.max(S.best, S.streak); } else { S.streak = 0; delta = -8; }
    S.answered += 1;
    const before = S.points;
    S.points = Math.max(0, S.points + delta);
    delta = S.points - before;
    let reached = S.stage;
    while (GRADES[reached + 1] && S.points >= GRADES[reached + 1].threshold) reached += 1;
    const promoted = reached > S.stage;
    const c = {
      mode: 'result', correct: right, title: pick(right ? CHEERS : SCOLDS),
      chosen: right ? [] : picked.filter(i => !d.answers.includes(i) && d.why[i]).map(i => ({ letter: LETTERS[i], text: d.q.choices[i].text, why: d.why[i] })),
      right: d.answers.map(i => `${LETTERS[i]}. ${d.q.choices[i].text}`).join(' · '), explanation: d.explanation, reference: d.reference,
      points: right ? `+${delta} points · ${S.points} in all · streak of ${S.streak}` : delta ? `−${-delta} points · ${S.points} in all · streak reset` : `${S.points} points · streak reset`,
      news: promoted ? `Promotion! Tagnan is now a ${GRADES[reached].name}: ${GRADES[reached].look}.` : right ? '' : 'This question will come back tomorrow.',
      promoted, rank: promoted ? GRADES[reached].name : '',
    };
    S.qi += 1;
    const course = current();
    Object.assign(course, { points: S.points, streak: S.streak });
    mood(right ? 'happy' : 'angry', right ? 4000 : 6000);
    if (promoted && !reduced()) {
      show(c, { ui: { evolving: true } });
      evolve(S.stage, reached);
    } else {
      S.stage = reached;
      course.stage = reached;
      renderFig();
      renderBar();
      show(c, { hide: right && !promoted ? 15000 : 0 });
    }
  }
  // As in the games: white, his old and new looks swap faster and faster, a flash, the new rank.
  function evolve(from, to) {
    const t0 = performance.now();
    S.evolving = true;
    timer('cover', () => { S.cover = true; S.rays = true; S.shown = from; renderFig(); renderHint(); }, 700);
    timer('swap', () => { S.stage = to; current().stage = to; renderBar(); }, 1300);
    const swing = () => {
      const t = performance.now() - t0;
      if (t >= 1100 && t < 3700) {
        const k = ((t - 1100) / 2600) ** 2;
        const shown = Math.floor(k * 15) % 2 ? to : from;
        if (shown !== S.shown) { S.shown = shown; renderFig(); }
      }
      if (t < 3700 && open) requestAnimationFrame(swing);
    };
    requestAnimationFrame(swing);
    timer('flash', () => { const f = $('#p-flash'); if (f) { f.classList.remove('on'); void f.offsetWidth; f.classList.add('on'); } }, 3700);
    timer('reveal', () => {
      S.cover = false; S.rays = false; S.shown = null; S.evolving = false;
      mood('happy', 4000);
      renderFig();
      if (S.bubble && S.bubble.promoted) { S.ui = { arrive: true }; renderBubble(false); }
      renderHint();
    }, 3850);
  }
  function close() {
    stop('hide');
    stop('unanswered');
    const was = S.bubble && S.bubble.mode;
    S.bubble = null;
    S.ui = {};
    renderBubble(false);
    if (S.expr === 'ask') mood('idle');
    if (S.pending) { const p = S.pending; S.pending = null; p(); return; }
    if (was && was !== 'quip' && was !== 'pause' && !paused()) scheduleNext();
  }
  const dismiss = () => close();
  function tap() {
    if (S.cover || S.gone) return;
    const t = now();
    S.taps = S.taps.filter(x => t - x < 1500).concat(t);
    const n = S.taps.length;
    const m = n >= 6 ? 'sulk' : n >= 3 ? 'annoyed' : 'wink';
    mood(m, m === 'sulk' ? 3500 : 1800);
    if (!S.bubble || S.bubble.mode === 'quip') {
      const line = paused() && m === 'wink' ? `On a break until ${clock(S.pausedUntil)}.` : pick(QUIPS[m]);
      show({ mode: 'quip', text: line }, { hide: 1800 });
    }
  }

  // --- His menu ------------------------------------------------------------------------------------
  function openMenu(x, y) {
    if (S.gone || S.cover) return;
    S.menu = { at: [clamp(x, 316, 1424), clamp(y, 520, 836)], ui: { current: 0, keyboard: false, typed: '', suggestions: [], sub: '', subRow: -1 } };
    renderMenu(true);
  }
  const closeMenu = () => { stop('hover'); S.menu = null; renderMenu(); };
  const rowsNow = () => S.menu.ui.typed.trim() ? suggestionRows(S.menu.ui.suggestions) : commandRows(menuContent());
  function openSub(which, row) {
    const u = S.menu.ui;
    const list = choicesOf(menuContent(), which);
    u.sub = which; u.subRow = row; u.current = row;
    u.subCurrent = Math.max(0, list.findIndex(x => x.key === chosenOf(menuContent(), which)));
    renderMenu();
  }
  function activate(i) {
    const r = rowsNow()[i];
    if (!r || r.separator) return;
    if (r.action.startsWith('sub:')) { openSub(r.action.slice(4), i); return; }
    run(r.action);
  }
  function run(actionName) {
    const [verb, ...rest] = actionName.split(':');
    const arg = rest.join(':');
    if (verb === 'call') { S.call = arg; play(arg); renderMenu(); return; }
    if (verb === 'volume') { S.volume = +arg; play(S.call); renderMenu(); return; }
    if (verb === 'theme') { setMode(arg); return; }
    if (verb === 'update') { startUpdate(); return; }
    closeMenu();
    if (verb === 'ask') { if (!S.bubble || !['question', 'thinking'].includes(S.bubble.mode)) ask(false); }
    else if (verb === 'stats') show(statsContent(), { ui: { paused: paused() } });
    else if (verb === 'subject') show(subjectContent());
    else if (verb === 'pause') { if (!arg || !pauseWith(arg)) show({ ...(paused() ? { ...PAUSE, status: `On a break until ${clock(S.pausedUntil)}.` } : PAUSE) }, { ui: { paused: paused() } }); }
    else if (verb === 'resume') resume();
    else if (verb === 'pace') setPace(arg);
    else if (verb === 'model') setModel(arg);
    else if (verb === 'learn') learn(arg);
    else if (verb === 'focus') setSubject(arg, arg);
    else if (verb === 'quit') { stopAll(); S.gone = true; S.bubble = null; renderBubble(false); renderFig(); renderGone(); renderHint(); }
  }
  function startUpdate() {
    if (S.update === 'busy') return;
    S.update = 'busy';
    renderMenu();
    timer('update', () => {
      closeMenu();
      S.update = 'idle';
      say('Freshly inked!', 'I’m up to date. What’s new:\n· Update & Restart, one row in his menu instead of two\n· His call’s volume, set by ear under his sounds\n· A cross puts away a course one no longer follows', { button: 'Splendid!', hide: 30000 });
      mood('happy', 4000);
    }, 2400);
  }
  function setPace(key) {
    S.pace = key;
    if (S.bubble && ['question', 'thinking'].includes(S.bubble.mode)) return;
    const [a, b] = GAPS[key];
    S.nextAt = now() + (a + Math.random() * (b - a)) * 60000;
    say('As you wish!', paused() ? `${SENTENCES[key]}, once your break is over.` : `${SENTENCES[key]}. The next one around ${clock(S.nextAt)}.`, { hide: 6000 });
  }
  function setModel(key) {
    if (key === S.model) return;
    S.model = key;
    const m = MODELS.find(x => x.key === key), short = m.name.split(',')[0];
    if (S.bubble && ['question', 'thinking', 'result', 'explanation', 'pause'].includes(S.bubble.mode)) return;
    say(`${short.split(' ')[0]} it is!`, `${short} writes my next questions: ${m.hint}. The ones I already hold stay as they are.`, { hide: 7000 });
  }
  function pauseWith(text) {
    const b = parseBreak(text);
    if (!b) return false;
    S.pausedUntil = b.until;
    stop('next');
    mood('idle');
    say('At ease!', `${b.said}. Not a word from me till then.`, { hide: 5000 });
    return true;
  }
  function resume() { S.pausedUntil = 0; if (S.bubble && S.bubble.mode === 'pause') close(); scheduleNext(); }
  function changeCourse(key, intro = '') {
    const c = courseOf(key);
    if (!c) return;
    if (key === S.course) { say('As you wish!', `We’re already on ${c.label}. I’ll keep to it.`, { hide: 9000 }); return; }
    S.course = key;
    S.subject = ''; S.subjectKey = '';
    S.stage = c.stage; S.points = c.points; S.streak = c.streak;
    renderFig(); renderBar();
    let text = intro || `From now on, we learn ${c.label}.`;
    text += ` Here I’m ${GRADES[c.stage].name}.`;
    if (key !== 'aif-c01') text += ' Give me a few minutes to write the questions.';
    mood('idle');
    say('As you wish!', text, { hide: 9000 });
    if (key === 'aif-c01') scheduleNext(); else stop('next');
  }
  function learn(text) {
    const said = text.trim().split(/\s+/).join(' ').replace(/[ .!?]+$/, '');
    if (!previewCourse(said).ok) return false;
    const known = knownCourse(said);
    if (known) { changeCourse(known.key); return true; }
    if (S.planning) { say('One at a time!', `I’m still drawing up a course on ${S.planning}.`, { hide: 8000 }); return true; }
    S.planning = said;
    say('Let me think…', `A course on ${said}: I’m drawing up its chapters, give me a minute or two. I’ll tell you when it’s ready.`, { hide: 8000 });
    timer('plan', () => {
      const name = said.replace(/\b\w/g, ch => ch.toUpperCase());
      const key = said.toLowerCase().replace(/[^a-z0-9]+/g, '-');
      const chapters = ['The basics', 'Tools and materials', 'Techniques', 'Putting it together'];
      CHAPTERS[key] = chapters;
      S.courses.push({ key, label: name, code: name, stage: 0, points: 0, streak: 0 });
      S.planning = null;
      const intro = `Your course is ready: ${name}. ${chapters.map((n, i) => `${i + 1}. ${n}`).join('; ')}.`;
      const go = () => changeCourse(key, intro);
      if (S.bubble && ['question', 'thinking', 'result', 'explanation', 'pause'].includes(S.bubble.mode)) S.pending = go; else go();
    }, 5000);
    return true;
  }
  function setSubject(key, label) {
    if ((S.subjectKey || '') === key) { say('As you wish!', `We’re already on ${S.subject || current().label}. I’ll keep to it.`, { hide: 7000 }); return; }
    S.subjectKey = key;
    const choice = subjectContent().choices.find(x => x.key === key);
    S.subject = key === '' ? '' : (choice ? choice.label.replace(/^\d+\. /, '') : label);
    say('As you wish!', `From now on, I ask about ${S.subject || (current().key === 'aif-c01' ? 'the whole exam' : 'all of ' + current().label)}, until you tell me otherwise.`, { hide: 7000 });
  }
  function play(key) {
    if (key === 'silent' || !SOUNDS[key] || !S.volume) return;
    try { const a = new Audio(SOUNDS[key]); a.volume = S.volume / 100; const p = a.play(); if (p && p.catch) p.catch(() => {}); } catch (e) { /* no audio */ }
  }

  // --- Events -------------------------------------------------------------------------------------
  function handle(a, el) {
    const [verb, ...rest] = a.split(':');
    const arg = rest.join(':');
    switch (verb) {
      case 'pick': {
        const i = +arg;
        if (S.bubble.need > 1) {
          const p = S.ui.picked || [];
          S.ui.picked = p.includes(i) ? p.filter(x => x !== i) : p.concat(i);
          renderBubble(false);
        } else answer([i]);
        break;
      }
      case 'confirm': answer(S.ui.picked || []); break;
      case 'later': S.nextAt = now() + 10 * 60000; close(); break;
      case 'flag':
        if (S.bubble && S.bubble.mode === 'question') S.qi += 1;
        stop('unanswered');
        mood('idle');
        say('Question set aside', 'Thank you, I won’t ask it again. My brain will write others.', { hide: 6000 });
        break;
      case 'dismiss': close(); break;
      case 'more':
        stop('hide');
        S.bubble = { ...S.bubble, mode: 'thinking' };
        S.ui = { dots: 1 };
        renderBubble(false);
        { let n = 1; const tick = () => { if (!S.bubble || S.bubble.mode !== 'thinking') return; n = n % 3 + 1; S.ui.dots = n; renderBubble(false); timer('dots', tick, 400); }; timer('dots', tick, 400); }
        timer('explain', () => { if (S.bubble && S.bubble.mode === 'thinking') show({ mode: 'explanation', title: 'Listen well', text: S.cur.more }); }, 2600);
        break;
      case 'pause': if (!pauseWith(arg)) S.ui.preview = previewBreak(arg); break;
      case 'pause-ok': { const f = $('#break-field', stageEl); if (f && !pauseWith(f.value)) { S.ui.preview = previewBreak(f.value); renderBubble(false); } break; }
      case 'resume': resume(); break;
      case 'showpause': show(PAUSE, { ui: { paused: paused() } }); break;
      case 'ask': close(); ask(false); break;
      case 'course': changeCourse(arg); break;
      case 'putaway': { const c = courseOf(arg); S.putAway = { key: c.key, label: c.label }; show(subjectContent()); break; }
      case 'undo': S.putAway = null; show(subjectContent()); break;
      case 'course-ok': { const f = $('#course-field', stageEl); if (f) learn(f.value); break; }
      case 'subject-ok': { const f = $('#subject-field', stageEl); if (f && f.value.trim()) setSubject(f.value.trim(), f.value.trim()); break; }
      case 'focus': setSubject(arg, arg); break;
      case 'row': activate(+arg); break;
      case 'choose': {
        const u = S.menu.ui, list = choicesOf(menuContent(), u.sub), x = list[+arg];
        u.subCurrent = +arg;
        if (u.sub === 'call') run('call:' + x.key); else run(u.sub + ':' + x.key);
        break;
      }
      case 'theme': setMode(mode === 'dark' ? 'light' : 'dark'); break;
      case 'comeback': S.gone = false; renderGone(); renderFig(); mood('happy', 4000); scheduleNext(); break;
      default: break;
    }
  }
  stageEl.addEventListener('click', e => {
    const a = e.target.closest('[data-act]');
    if (a) { handle(a.dataset.act, a); return; }
    if (e.target.closest('#p-fig')) { tap(); return; }
    if (S.menu && !e.target.closest('#p-menu')) closeMenu();
    if (S.bubble && S.bubble.mode !== 'question' && !e.target.closest('#p-bubble') && !e.target.closest('#p-menu')) close();
  });
  stageEl.addEventListener('contextmenu', e => {
    if (!e.target.closest('#p-fig')) return;
    e.preventDefault();
    const r = $('#pscreen').getBoundingClientRect();
    openMenu((e.clientX - r.left) / scale, (e.clientY - r.top) / scale);
  });
  let press = 0;
  stageEl.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' || !e.target.closest('#p-fig')) return;
    const r = $('#pscreen').getBoundingClientRect();
    const x = (e.clientX - r.left) / scale, y = (e.clientY - r.top) / scale;
    press = setTimeout(() => { press = -1; openMenu(x, y); }, 550);
  });
  stageEl.addEventListener('pointerup', () => { if (press > 0) clearTimeout(press); });
  stageEl.addEventListener('pointerover', e => {
    if (!S || !S.menu) return;
    const u = S.menu.ui;
    if (e.target.closest('.m-subpanel')) {
      stop('hover');
      const sr = e.target.closest('.s-row');
      if (sr) { const i = +sr.dataset.act.split(':')[1]; if (u.subCurrent !== i || u.current !== u.subRow) { u.subCurrent = i; u.current = u.subRow; renderMenu(); } }
      else if (e.target.closest('.s-vol')) { const n = choicesOf(menuContent(), u.sub).length; if (u.subCurrent !== n) { u.subCurrent = n; renderMenu(); } }
      return;
    }
    const row = e.target.closest('.m-row');
    if (!row) return;
    const i = +row.dataset.row;
    if (u.current === i) return;
    u.current = i;
    u.keyboard = false;
    renderMenu();
    const r = rowsNow()[i];
    const want = r && r.more ? r.action.slice(4) : '';
    if (want === u.sub) stop('hover');
    else timer('hover', () => { if (!S.menu) return; if (want) openSub(want, i); else { S.menu.ui.sub = ''; renderMenu(); } }, 220);
  });
  stageEl.addEventListener('input', e => {
    const which = e.target.dataset.input;
    if (!which) return;
    const v = e.target.value;
    if (which === 'menu') { const u = S.menu.ui; u.typed = v; u.suggestions = suggest(v); u.current = 0; u.sub = ''; renderMenu(); }
    else if (which === 'break-field') { S.ui.field = v; S.ui.preview = previewBreak(v); renderBubble(false); }
    else if (which === 'course-field') { S.ui.course = v; S.ui.coursePreview = previewCourse(v); renderBubble(false); }
    else if (which === 'subject-field') { S.ui.subject = v; S.ui.subjectPreview = previewSubject(v); renderBubble(false); }
  });
  stageEl.addEventListener('change', e => { if (e.target.dataset.input === 'volume') run('volume:' + e.target.value); });
  stageEl.addEventListener('keydown', e => {
    const which = e.target.dataset && e.target.dataset.input;
    if (e.key === 'Enter' && which === 'break-field') { if (!pauseWith(e.target.value)) { S.ui.preview = previewBreak(e.target.value); renderBubble(false); } e.preventDefault(); return; }
    if (e.key === 'Enter' && which === 'course-field') { learn(e.target.value); e.preventDefault(); return; }
    if (e.key === 'Enter' && which === 'subject-field') { if (e.target.value.trim()) setSubject(e.target.value.trim(), e.target.value.trim()); e.preventDefault(); return; }
    if (e.key === 'Enter' && e.target.closest('[data-act]') && !which) { handle(e.target.closest('[data-act]').dataset.act); e.preventDefault(); return; }
    if (which !== 'menu' || !S.menu) return;
    const u = S.menu.ui;
    const rows = rowsNow();
    const stops = rows.map((r, i) => r.separator ? -1 : i).filter(i => i >= 0);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      const step = e.key === 'ArrowDown' ? 1 : -1;
      u.keyboard = true;
      if (u.sub) { const n = choicesOf(menuContent(), u.sub).length + (u.sub === 'call' ? 1 : 0); u.subCurrent = ((u.subCurrent ?? 0) + step + n) % n; }
      else { const here = Math.max(0, stops.indexOf(u.current)); u.current = stops[(here + step + stops.length) % stops.length]; }
      renderMenu();
      e.preventDefault();
    } else if (e.key === 'Enter') {
      if (u.sub) {
        const list = choicesOf(menuContent(), u.sub);
        if (u.sub === 'call' && u.subCurrent === list.length) run('volume:' + S.volume);
        else handle('choose:' + u.subCurrent);
      } else activate(u.current);
      e.preventDefault();
    } else if (e.key === 'ArrowRight') {
      const onVolume = u.sub === 'call' && u.subCurrent === choicesOf(menuContent(), 'call').length;
      const r = rows[u.current];
      if (onVolume) run('volume:' + Math.min(100, S.volume + 5));
      else if (!u.sub && r && r.more && e.target.selectionStart === e.target.value.length) activate(u.current);
      else return;
      e.preventDefault();
    } else if (e.key === 'ArrowLeft') {
      const onVolume = u.sub === 'call' && u.subCurrent === choicesOf(menuContent(), 'call').length;
      if (onVolume) run('volume:' + Math.max(0, S.volume - 5));
      else if (u.sub) { u.sub = ''; renderMenu(); }
      else return;
      e.preventDefault();
    } else if (e.key === 'Escape') {
      if (u.sub) { u.sub = ''; renderMenu(); } else if (u.typed) { u.typed = ''; u.suggestions = []; u.current = 0; renderMenu(); } else closeMenu();
      e.preventDefault();
      e.stopPropagation();
    }
  });
  document.addEventListener('keydown', e => {
    if (!open || e.key !== 'Escape') return;
    if (S.menu) closeMenu();
    else if (S.bubble && S.bubble.mode !== 'question') close();
    else closeProto();
  });
  window.addEventListener('resize', () => { if (open) fit(); });
  $('#p-restart').addEventListener('click', () => { stopAll(); S = fresh(); render(); timer('first', () => ask(true), 900); });
  $('#p-close').addEventListener('click', () => closeProto());

  function openProto() {
    open = true;
    root.hidden = false;
    if (!S) S = fresh();
    render();
    if (!S.bubble && !S.gone) timer('first', () => ask(true), 900);
    $('#p-close').focus({ preventScroll: true });
  }
  function closeProto() {
    open = false;
    root.hidden = true;
    stopAll();
    S = null;
    canvas.focus({ preventScroll: true });
  }
  return { open: openProto, close: closeProto, isOpen: () => open, render };
})();
window.Proto = Proto;

boot();
</script>
</body>
