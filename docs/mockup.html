<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tagnan Mockup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Tagnan's interface as a design file: foundations, components, character, screens, flows, desktops and a playable prototype.">
<!-- Generated from Tagnan's sources (Theme.qml, Bubble.qml, TagnanMenu.qml, controller.py, menu.py, art.py, assets/sounds). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a Figma-style design file. Left, pages and layers; centre, an infinite canvas of
   frames to pan and zoom; right, the selected frame's properties and the data Tagnan's
   controller sends it. Frames draw his components from the --tg-* tokens, generated from
   tagnan/ui/qml/Theme.qml, in the mode chosen at the top right. */
:root {
  /* the editor around the frames */
  --ui-panel: #FFFFFF;
  --ui-canvas: #E7EAEE;
  --ui-text: #1D2129;
  --ui-muted: #646C7A;
  --ui-faint: #98A0AC;
  --ui-line: #E1E4E9;
  --ui-hover: #F1F3F6;
  --ui-active: #E2EFFF;
  --ui-sel: #0D99FF;
  --ui-on-sel: #FFFFFF;
  --ui-section: rgba(255, 255, 255, .55);
  --ui-section-line: #D2D7DF;
  --ui-code: #F5F7FA;
  --ui-scrim: rgba(16, 20, 28, .32);
  --ui-shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 10px 28px rgba(16, 24, 40, .12);
  --ui-red: #F24822;
  --ui-font: 'Inter', 'Segoe UI Variable Text', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
  --ui-mono: 'JetBrains Mono', 'Cascadia Mono', ui-monospace, 'SF Mono', Consolas, monospace;
  /* documentation frames: paper, in Tagnan's light ink, whatever the mode */
  --doc-paper: #FFFFFF;
  --doc-ink: #1B2232;
  --doc-muted: #5B6478;
  --doc-faint: #8A93A6;
  --doc-line: #E3E7EE;
  --doc-soft: #F4F6F9;
  --doc-accent: #2B4A8C;
  --doc-gold: #8F6A12;
  /* Tagnan's faces: Georgia for display, the system's own interface face for the rest */
  --tg-display: Georgia, 'Times New Roman', serif;
  --tg-body: 'Segoe UI', 'Helvetica Neue', system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ui-panel: #22252B; --ui-canvas: #16181C; --ui-text: #ECEEF2; --ui-muted: #A1A8B4; --ui-faint: #6C7380;
    --ui-line: #32363E; --ui-hover: #2B2F36; --ui-active: #173352; --ui-section: rgba(255, 255, 255, .03);
    --ui-section-line: #30353D; --ui-code: #1A1D22; --ui-scrim: rgba(0, 0, 0, .5);
    --ui-shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 10px 28px rgba(0, 0, 0, .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ui-panel: #22252B; --ui-canvas: #16181C; --ui-text: #ECEEF2; --ui-muted: #A1A8B4; --ui-faint: #6C7380;
  --ui-line: #32363E; --ui-hover: #2B2F36; --ui-active: #173352; --ui-section: rgba(255, 255, 255, .03);
  --ui-section-line: #30353D; --ui-code: #1A1D22; --ui-scrim: rgba(0, 0, 0, .5);
  --ui-shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 10px 28px rgba(0, 0, 0, .45);
  color-scheme: dark;
}
/* Generated from tagnan/ui/qml/Theme.qml */
:root, .tg-light { --tg-panel: #FBFAF7; --tg-text: #1B2232; --tg-muted: #5B6478; --tg-line: #D5DBE6; --tg-ink: #2B4A8C; --tg-gold: #8F6A12; --tg-goldSoft: #F3E8C9; --tg-goldInk: #7A5A0F; --tg-good: #2D7A4E; --tg-bad: #B3343A; --tg-badSoft: #F6DFE0; --tg-choice: #EEF1F6; --tg-choiceHover: #E1E7F1; --tg-choiceOn: #D3DEF2; --tg-shadow: rgba(21, 32, 64, 0.2); --tg-shadow-soft: rgba(21, 32, 64, 0.11); --tg-desk: linear-gradient(160deg, #E9EEF5, #DCE3EE); }
.tg-light { color-scheme: light; }
.tg-dark { --tg-panel: #1B2232; --tg-text: #E7EBF3; --tg-muted: #9AA4B8; --tg-line: #2F3A52; --tg-ink: #8FB2EC; --tg-gold: #E0B54E; --tg-goldSoft: #3A3322; --tg-goldInk: #E0B54E; --tg-good: #6FCB95; --tg-bad: #F07A80; --tg-badSoft: #3A2430; --tg-choice: #232C40; --tg-choiceHover: #2C3852; --tg-choiceOn: #33456B; --tg-shadow: rgba(0, 0, 0, 0.4); --tg-shadow-soft: rgba(0, 0, 0, 0.22); --tg-desk: linear-gradient(160deg, #182032, #0F1522); color-scheme: dark; }

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--ui-canvas); color: var(--ui-text); overflow: hidden;
  font: 12px/1.45 var(--ui-font); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ui-sel); outline-offset: 1px; }
[hidden] { display: none !important; }

/* --- Shell ----------------------------------------------------------------------------------- */
.app {
  position: fixed; inset: 0; display: grid;
  grid-template-columns: 252px minmax(0, 1fr) 292px; grid-template-areas: "left canvas right";
}
.panel { background: var(--ui-panel); display: flex; flex-direction: column; min-height: 0; min-width: 0; z-index: 5; }
.panel.left { grid-area: left; border-right: 1px solid var(--ui-line); padding-left: env(safe-area-inset-left, 0px); }
.panel.right { grid-area: right; border-left: 1px solid var(--ui-line); padding-right: env(safe-area-inset-right, 0px); }
.mbar { display: none; }
.scrim { position: fixed; inset: 0; background: var(--ui-scrim); z-index: 15; }

.file {
  display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--ui-line);
  padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 14px;
}
.file-mark { width: 34px; height: 34px; border-radius: 9px; background: #1B2232; display: grid; place-items: center; flex: none; }
.file-mark .ico { width: 26px; height: 26px; }
.file-name { font-weight: 600; font-size: 13px; letter-spacing: -.005em; }
.file-sub { color: var(--ui-muted); font-size: 11px; }
.ph { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 6px; font-weight: 600; font-size: 11px; }
.ph span { color: var(--ui-faint); font-weight: 500; font-variant-numeric: tabular-nums; }
.pages { display: flex; flex-direction: column; padding: 0 8px 10px; border-bottom: 1px solid var(--ui-line); }
.page-btn {
  display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: transparent;
  border-radius: 6px; padding: 6px 8px; cursor: pointer;
}
.page-btn:hover { background: var(--ui-hover); }
.page-btn[aria-current="page"] { background: var(--ui-active); font-weight: 600; }
.page-btn .tick { width: 12px; flex: none; color: var(--ui-text); opacity: 0; }
.page-btn[aria-current="page"] .tick { opacity: 1; }
.page-btn .n { margin-left: auto; color: var(--ui-faint); font-size: 11px; font-weight: 500; font-variant-numeric: tabular-nums; }
.layers { flex: 1; overflow: auto; padding: 0 8px 16px; min-height: 0; }
.lsec { display: flex; align-items: center; gap: 6px; padding: 8px 8px 4px; color: var(--ui-muted); font-weight: 600; font-size: 11px; }
.lsec svg { flex: none; color: var(--ui-faint); }
.lrow {
  display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: transparent; text-align: left;
  padding: 5px 8px 5px 24px; border-radius: 6px; cursor: pointer; white-space: nowrap;
}
.lrow:hover { background: var(--ui-hover); }
.lrow.is-sel { background: var(--ui-active); }
.lrow svg { flex: none; color: var(--ui-faint); }
.lrow.is-sel svg { color: var(--ui-sel); }
.lrow .nm { overflow: hidden; text-overflow: ellipsis; min-width: 0; }

.rtop { display: flex; align-items: center; gap: 8px; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; border-bottom: 1px solid var(--ui-line); }
.seg { display: inline-flex; background: var(--ui-hover); border-radius: 8px; padding: 2px; }
.seg button {
  border: 0; background: transparent; padding: 5px 10px; border-radius: 6px; font-weight: 500; cursor: pointer;
  color: var(--ui-muted); display: inline-flex; align-items: center; gap: 6px;
}
.seg button[aria-pressed="true"] { background: var(--ui-panel); color: var(--ui-text); box-shadow: 0 1px 2px rgba(0, 0, 0, .14); }
.present {
  margin-left: auto; background: var(--ui-sel); color: var(--ui-on-sel); border: 0; border-radius: 8px;
  padding: 7px 12px; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; cursor: pointer;
}
.present:hover { filter: brightness(1.06); }
.tabs { display: flex; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--ui-line); }
.tab {
  border: 0; background: transparent; padding: 10px 8px 9px; font-weight: 600; color: var(--ui-muted); cursor: pointer;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.tab[aria-selected="true"] { color: var(--ui-text); border-bottom-color: var(--ui-text); }
.insp { flex: 1; overflow: auto; min-height: 0; }
.ig { padding: 14px 16px; border-bottom: 1px solid var(--ui-line); display: grid; gap: 10px; min-width: 0; }
.ig h3 { margin: 0; font-size: 11px; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
.ig h3 span { color: var(--ui-faint); font-weight: 500; }
.ihead { display: flex; align-items: flex-start; gap: 8px; }
.ihead svg { flex: none; margin-top: 2px; color: var(--ui-sel); }
.ihead b { display: block; font-size: 13px; font-weight: 600; line-height: 1.3; }
.ihead span { color: var(--ui-muted); }
.props { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.prop { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px; border-radius: 6px; background: var(--ui-hover); font-variant-numeric: tabular-nums; min-width: 0; }
.prop b { color: var(--ui-faint); font-weight: 500; }
.toks { display: grid; gap: 7px; }
.tok { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; align-items: center; gap: 8px; }
.sw { width: 16px; height: 16px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .14); }
.tok .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hex { font: 11px var(--ui-mono); color: var(--ui-muted); }
.styles { display: grid; gap: 6px; }
.styles div { display: flex; justify-content: space-between; gap: 10px; }
.styles span { color: var(--ui-muted); text-align: right; }
.notes { margin: 0; padding-left: 16px; display: grid; gap: 6px; line-height: 1.5; }
.code {
  margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--ui-code); border: 1px solid var(--ui-line);
  font: 11px/1.55 var(--ui-mono); white-space: pre; overflow: auto; max-height: 460px; color: var(--ui-text); tab-size: 2;
}
.code .k { color: #8250DF; } .code .s { color: #0A7F3F; } .code .n { color: #B35900; }
:root[data-theme="dark"] .code .k { color: #C9A8FF; } :root[data-theme="dark"] .code .s { color: #7EE2A8; } :root[data-theme="dark"] .code .n { color: #FFB86B; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .code .k { color: #C9A8FF; } :root:not([data-theme="light"]) .code .s { color: #7EE2A8; } :root:not([data-theme="light"]) .code .n { color: #FFB86B; } }
.path { font: 11px/1.6 var(--ui-mono); color: var(--ui-muted); overflow-wrap: anywhere; }
.muted { color: var(--ui-muted); }
.kbd { font: 500 10.5px/1 var(--ui-mono); padding: 3px 5px; border-radius: 4px; background: var(--ui-hover); border: 1px solid var(--ui-line); white-space: nowrap; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 7px 12px; align-items: center; margin: 0; }
.keys dt { justify-self: start; }
.keys dd { margin: 0; color: var(--ui-muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--ui-line); border-radius: 999px; padding: 3px 9px; background: transparent; cursor: pointer; }
.chip:hover { background: var(--ui-hover); }

/* --- Canvas ---------------------------------------------------------------------------------- */
.canvas {
  grid-area: canvas; position: relative; overflow: hidden; background: var(--ui-canvas);
  touch-action: none; outline: none; user-select: none; -webkit-user-select: none;
}
.canvas.hand, .canvas.space { cursor: grab; }
.canvas.panning { cursor: grabbing; }
.world { position: absolute; left: 0; top: 0; width: max-content; transform-origin: 0 0; }
.world.moving { will-change: transform; }
.ov { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 2; }
.ov svg.links { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.links path.wire { fill: none; stroke: var(--ui-sel); stroke-width: 1.6; }
.links path.head { fill: var(--ui-sel); }
.links circle { fill: var(--ui-panel); stroke: var(--ui-sel); stroke-width: 1.6; }
.flabel {
  position: absolute; left: 0; top: 0; font: 500 11px/16px var(--ui-font); color: var(--ui-muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: auto; cursor: default;
}
.flabel:hover, .flabel.is-sel { color: var(--ui-sel); }
.spill {
  position: absolute; left: 0; top: 0; max-width: 260px; padding: 4px 9px; border-radius: 6px; background: var(--ui-panel);
  border: 1px solid var(--ui-section-line); font: 600 11px/14px var(--ui-font); color: var(--ui-text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-shadow: 0 1px 2px rgba(16, 24, 40, .06);
}
.world.far .sec-h, .world.far .sec-d { visibility: hidden; }
.hov, .sel { position: absolute; left: 0; top: 0; border: 1px solid var(--ui-sel); }
.hov { border-width: 1.5px; }
.sel i { position: absolute; width: 7px; height: 7px; background: #FFFFFF; border: 1px solid var(--ui-sel); }
.sel i:nth-child(1) { left: -4px; top: -4px; } .sel i:nth-child(2) { right: -4px; top: -4px; }
.sel i:nth-child(3) { left: -4px; bottom: -4px; } .sel i:nth-child(4) { right: -4px; bottom: -4px; }
.sel .dim {
  position: absolute; left: 50%; top: calc(100% + 8px); transform: translateX(-50%); background: var(--ui-sel);
  color: var(--ui-on-sel); font: 500 11px/1 var(--ui-font); padding: 4px 6px; border-radius: 4px; white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.alabel {
  position: absolute; left: 0; top: 0; background: var(--ui-sel); color: var(--ui-on-sel); font: 600 11px/1 var(--ui-font);
  padding: 5px 8px; border-radius: 999px; white-space: nowrap; box-shadow: 0 1px 3px rgba(0, 0, 0, .18);
}

.tools {
  position: absolute; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 12px; background: var(--ui-panel);
  border: 1px solid var(--ui-line); box-shadow: var(--ui-shadow); z-index: 6; max-width: calc(100% - 32px);
}
.tool {
  width: 32px; height: 32px; border: 0; border-radius: 8px; background: transparent; display: grid;
  place-items: center; cursor: pointer; flex: none;
}
.tool:hover { background: var(--ui-hover); }
.tool[aria-pressed="true"] { background: var(--ui-sel); color: var(--ui-on-sel); }
.tools .sep { width: 1px; height: 20px; background: var(--ui-line); margin: 0 4px; flex: none; }
.zoomv {
  min-width: 56px; height: 32px; border: 0; background: transparent; border-radius: 8px; font-weight: 600;
  font-variant-numeric: tabular-nums; cursor: pointer; flex: none;
}
.zoomv:hover { background: var(--ui-hover); }
.help {
  position: absolute; right: 16px; bottom: calc(70px + env(safe-area-inset-bottom, 0px)); width: 320px;
  max-width: calc(100% - 32px); background: var(--ui-panel); border: 1px solid var(--ui-line); border-radius: 12px;
  box-shadow: var(--ui-shadow); padding: 16px; z-index: 7;
}
.help h4 { margin: 0 0 10px; font-size: 12px; }
.toast {
  position: absolute; left: 50%; top: 16px; transform: translateX(-50%); background: var(--ui-text); color: var(--ui-panel);
  padding: 7px 12px; border-radius: 8px; font-weight: 500; z-index: 8; pointer-events: none; white-space: nowrap;
}

/* --- World: sections, frames, captions --------------------------------------------------------- */
.page-root { position: relative; width: max-content; display: flex; flex-direction: column; align-items: flex-start; gap: 220px; }
.srow { display: flex; align-items: flex-start; gap: 180px; }
.sec { position: relative; padding: 68px 76px 84px; border-radius: 36px; background: var(--ui-section); border: 1px solid var(--ui-section-line); }
.sec-h { margin: 0 0 10px; font: 700 44px/1.08 var(--tg-display); color: var(--ui-text); letter-spacing: -.01em; }
.sec-d { margin: 0 0 60px; max-width: 66ch; font: 19px/1.55 var(--ui-font); color: var(--ui-muted); }
.sec-b { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 80px 72px; }
.sec-b.grid { display: grid; align-items: start; justify-items: start; }
.frame { position: relative; flex: none; display: flex; flex-direction: column; }
.fbody { position: relative; overflow: hidden; flex: none; }
.fcap { width: 0; min-width: 100%; margin: 40px 0 0; font: 16px/1.5 var(--ui-font); color: var(--ui-muted); }
.fcap b { color: var(--ui-text); font-weight: 600; }

/* --- Tagnan's components (Bubble.qml, TagnanMenu.qml) ------------------------------------------ */
.tg { font-family: var(--tg-body); color: var(--tg-text); }
.tg-light .when-dark, .tg-dark .when-light { display: none !important; }
.mac { --tg-body: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
.desk { background: var(--tg-desk); }
.surface { background: var(--tg-panel); }
.glyph { display: block; flex: none; }
.glyph.spin { transform: rotate(-40deg); }
.fig { position: relative; flex: none; }
.fig > svg { position: absolute; left: 0; bottom: 0; width: 100%; height: auto; overflow: visible; display: block; }
.ico { display: inline-block; flex: none; }
.ico > svg { width: 100%; height: 100%; display: block; }
.scene { display: flex; align-items: flex-end; padding: 44px 44px 30px 40px; }
.scene > .tg-bubble { margin: 0 -2px 64px 0; flex: none; }

.tg-bubble { position: relative; flex: none; width: 400px; color: var(--tg-text); font-family: var(--tg-body); }
.tg-bubble > .b-shadow { position: absolute; left: 2px; top: 4px; width: 100%; height: 100%; border-radius: 14px; background: var(--tg-shadow); }
.tg-bubble > .b-tail {
  position: absolute; width: 14px; height: 14px; left: calc(100% - 8px); top: calc(100% - 34px); transform: rotate(45deg);
  background: var(--tg-panel); border: 1px solid var(--tg-line);
}
.tg-bubble > .b-panel { position: absolute; inset: 0; border-radius: 14px; background: var(--tg-panel); border: 1px solid var(--tg-line); }
.tg-bubble > .b-cover { position: absolute; width: 10px; height: 18px; left: calc(100% - 10px); top: calc(100% - 38px); background: var(--tg-panel); }
.tg-bubble.tail-left > .b-tail { left: -6px; }
.tg-bubble.tail-left > .b-cover { left: 0; }
.b-col { position: relative; padding: 14px; display: flex; flex-direction: column; gap: 9px; max-height: 590px; overflow: hidden; }
.b-col > .tg-action { align-self: flex-start; }
.tg-bubble.is-quip { width: auto; max-width: 260px; display: inline-block; }
.tg-bubble.is-quip > .b-panel { border-radius: 16px; }
.q-text { position: relative; padding: 10px 14px; max-width: 260px; font: italic 15px/1.16 var(--tg-display); color: var(--tg-text); }
.b-head { display: flex; align-items: center; gap: 8px; }
.b-title { flex: 1; min-width: 0; font: 700 19px/1.16 var(--tg-display); }
.b-chip {
  flex: none; height: 20px; border-radius: 10px; border: 1px solid var(--tg-ink); padding: 0 6px; color: var(--tg-ink);
  font: 600 11px/18px var(--tg-body); white-space: nowrap;
}
.b-meta {
  font: 700 11px/1.35 var(--tg-body); letter-spacing: .6px; text-transform: uppercase; color: var(--tg-gold);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.b-para { font: 13px/1.5 var(--tg-body); color: var(--tg-text); white-space: pre-line; overflow-wrap: anywhere; }
.b-para b { font-weight: 700; }
.b-14 { font-size: 14px; }
.b-12 { font-size: 12px; }
.b-note { font-size: 12px; color: var(--tg-muted); }
.b-italic { font-style: italic; }
.b-news { color: var(--tg-gold); font-weight: 600; }
.b-semi { font-weight: 600; }
.b-choice {
  position: relative; border-radius: 7px; background: var(--tg-choice); border: 1px solid transparent;
  padding: 6px 9px 6px 29px; font: 13px/1.35 var(--tg-body); color: var(--tg-text); cursor: pointer;
}
.b-choice > b { position: absolute; left: 9px; top: 6px; font-weight: 700; color: var(--tg-ink); }
.b-choice.is-hover { background: var(--tg-choiceHover); border-color: var(--tg-ink); }
.b-choice.is-on { background: var(--tg-choiceOn); border-color: var(--tg-ink); }
.b-bar { height: 30px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.b-links { display: flex; align-items: center; gap: 14px; }
.b-row8 { display: flex; align-items: center; gap: 8px; }
.b-flow { display: flex; flex-wrap: wrap; gap: 6px; }
.b-line { height: 1px; background: var(--tg-line); flex: none; }
.b-thinking { font: italic 13px var(--tg-body); color: var(--tg-muted); }
.b-rank { display: flex; flex-direction: column; gap: 2px; }
.b-rank-over { font: 11px/1.35 var(--tg-body); letter-spacing: 3px; color: var(--tg-muted); }
.b-rank-name { font: 700 26px/1.16 var(--tg-display); letter-spacing: 3px; color: var(--tg-gold); }
.b-rank-name.arrive { animation: arrive .45s cubic-bezier(.33, 1, .68, 1) both; }
@keyframes arrive { from { letter-spacing: 14px; opacity: 0; } 66% { opacity: 1; } to { letter-spacing: 3px; opacity: 1; } }
.b-prog { height: 6px; border-radius: 3px; background: var(--tg-choice); flex: none; }
.b-prog > i { display: block; height: 100%; border-radius: 3px; background: var(--tg-gold); }
.b-dom { position: relative; height: 30px; flex: none; font: 12px/1.35 var(--tg-body); }
.b-dom .n { position: absolute; left: 0; top: 0; width: calc(100% - 52px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--tg-text); }
.b-dom .c { position: absolute; right: 0; top: 0; color: var(--tg-muted); font-variant-numeric: tabular-nums; }
.b-dom .t { position: absolute; left: 0; right: 0; top: 19px; height: 5px; border-radius: 2.5px; background: var(--tg-choice); }
.b-dom .t > i { display: block; height: 100%; border-radius: 2.5px; }
.b-undo { color: var(--tg-text); text-decoration: underline; cursor: pointer; }
.b-course {
  position: relative; display: inline-block; height: 30px; line-height: 30px; padding: 0 12px; border-radius: 6px;
  background: var(--tg-choice); color: var(--tg-text); font: 600 13px/30px var(--tg-body); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; max-width: 100%; cursor: pointer;
}
.b-course.can-x { padding-right: 34px; }
.b-course.is-on { background: var(--tg-ink); color: var(--tg-panel); }
.b-course.is-hover { background: var(--tg-choiceHover); }
.b-x { position: absolute; right: 6px; top: 5px; width: 20px; height: 20px; border-radius: 4px; }
.b-x::before, .b-x::after {
  content: ""; position: absolute; left: 4.5px; top: 9.2px; width: 11px; height: 1.6px; border-radius: .8px;
  background: var(--tg-muted); transform: rotate(45deg);
}
.b-x::after { transform: rotate(-45deg); }
.b-x.is-hover { background: var(--tg-badSoft); }
.b-x.is-hover::before, .b-x.is-hover::after { background: var(--tg-bad); }

.tg-action {
  display: inline-block; height: 30px; line-height: 30px; padding: 0 12px; border-radius: 6px; background: var(--tg-choice);
  color: var(--tg-text); font: 600 13px/30px var(--tg-body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 100%; vertical-align: top; cursor: pointer; flex: none;
}
.tg-action.is-primary { background: var(--tg-ink); color: var(--tg-panel); }
.tg-action.is-hover:not(.is-primary) { background: var(--tg-choiceHover); }
.tg-action.is-off { opacity: .45; cursor: default; }
.tg-link { font: 12px/1.35 var(--tg-body); color: var(--tg-muted); cursor: pointer; white-space: nowrap; }
.tg-link.is-hover { color: var(--tg-text); text-decoration: underline; }
.f-row { display: flex; gap: 8px; flex: none; }
.tg-field {
  position: relative; flex: 1; min-width: 0; height: 32px; border-radius: 6px; background: var(--tg-choice);
  border: 1px solid var(--tg-line); padding: 0 10px; display: flex; align-items: center; gap: 0;
  font: 13px var(--tg-body); color: var(--tg-text); white-space: nowrap; overflow: hidden; outline: none;
}
.tg-field.is-focus, input.tg-field:focus { border-color: var(--tg-ink); }
input.tg-field { display: block; width: 100%; font: 13px var(--tg-body); color: var(--tg-text); }
input.tg-field::placeholder { color: var(--tg-muted); opacity: 1; }
.f-ph { color: var(--tg-muted); overflow: hidden; text-overflow: ellipsis; }
.caret { display: block; width: 1px; height: 16px; background: var(--tg-text); flex: none; }
.caret.at-start { position: absolute; left: 10px; top: 50%; margin-top: -8px; }

/* His menu */
.tg-menu { position: relative; width: 300px; flex: none; font-family: var(--tg-body); color: var(--tg-text); }
.m-panel, .m-subpanel {
  position: relative; border-radius: 14px; background: var(--tg-panel); border: 1px solid var(--tg-line); padding: 8px;
  display: flex; flex-direction: column; gap: 2px; box-shadow: 0 6px 0 var(--tg-shadow-soft), 1px 3px 0 var(--tg-shadow);
}
.m-panel { width: 300px; }
.m-subpanel { position: absolute; left: 306px; top: 0; width: 230px; }
.m-subpanel.is-left { left: -236px; }
.m-head { display: flex; align-items: flex-start; gap: 12px; padding: 6px 0 8px 8px; }
.m-hcol { width: 172px; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.m-grade { font: 700 17px/1.16 var(--tg-display); color: var(--tg-text); }
.m-bar { height: 5px; border-radius: 2.5px; background: var(--tg-choice); }
.m-bar > i { display: block; height: 100%; border-radius: 2.5px; background: var(--tg-gold); }
.m-points { font: 12px/1.35 var(--tg-body); color: var(--tg-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m-theme { width: 32px; height: 32px; border-radius: 9px; background: var(--tg-choice); display: grid; place-items: center; flex: none; cursor: pointer; }
.m-theme.is-hover { background: var(--tg-choiceHover); }
.m-field {
  position: relative; height: 36px; border-radius: 9px; background: var(--tg-choice); border: 1px solid transparent;
  padding: 0 10px 0 34px; display: flex; align-items: center; font: 13px var(--tg-body); color: var(--tg-text);
  white-space: nowrap; overflow: hidden; flex: none;
}
.m-field.is-typing { border-color: var(--tg-ink); }
.m-field > .glyph { position: absolute; left: 10px; top: 50%; margin-top: -9px; }
.m-field .caret.at-start { left: 34px; }
.m-field input { all: unset; width: 100%; font: 13px var(--tg-body); color: var(--tg-text); }
.m-field input::placeholder { color: var(--tg-muted); }
.m-gap { height: 4px; flex: none; }
.m-nomatch { padding: 6px 10px 8px; font: 13px/1.4 var(--tg-body); color: var(--tg-muted); }
.m-row {
  position: relative; height: 36px; display: flex; align-items: center; gap: 12px; padding: 0 10px; border-radius: 9px;
  flex: none; cursor: pointer; min-width: 0;
}
.m-row.is-primary { height: 40px; background: var(--tg-ink); }
.m-row.is-two { height: 46px; }
.m-row.is-hl { background: var(--tg-choiceHover); }
.m-row.is-ring { box-shadow: inset 0 0 0 2px var(--tg-gold); }
.m-label { flex: 1; min-width: 0; font: 14px/1.3 var(--tg-body); color: var(--tg-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m-row.is-primary .m-label { color: var(--tg-panel); font-weight: 600; }
.m-row.is-strong .m-label { font-weight: 600; }
.m-row.is-quiet .m-label { color: var(--tg-muted); font-size: 13px; }
.m-two { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.m-sub { font: 12px/1.3 var(--tg-body); color: var(--tg-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m-value { max-width: 130px; font: 12px/1.3 var(--tg-body); color: var(--tg-muted); white-space: pre; overflow: hidden; text-overflow: ellipsis; text-align: right; flex: none; }
.m-row.is-primary .m-value { color: var(--tg-panel); opacity: .8; }
.m-pill { height: 18px; border-radius: 9px; padding: 0 8px; background: var(--tg-goldSoft); color: var(--tg-goldInk); font: 700 11px/18px var(--tg-body); flex: none; }
.m-busy { position: absolute; left: 40px; right: 10px; bottom: 4px; height: 3px; border-radius: 1.5px; background: var(--tg-choice); overflow: hidden; }
.m-busy > i { position: absolute; left: 22%; top: 0; width: 35%; height: 100%; border-radius: 1.5px; background: var(--tg-ink); }
.m-sep { position: relative; height: 9px; flex: none; }
.m-sep::after { content: ""; position: absolute; left: 6px; right: 6px; top: 4px; height: 1px; background: var(--tg-line); }
.s-title { padding: 4px 10px 6px; font: 700 14px/1.2 var(--tg-display); color: var(--tg-text); }
.s-subtitle { padding: 0 10px 4px; font: 12px/1.35 var(--tg-body); color: var(--tg-muted); }
.s-row { position: relative; height: 34px; border-radius: 9px; display: flex; align-items: center; padding: 0 36px 0 32px; flex: none; cursor: pointer; }
.s-row.has-hint { height: 46px; }
.s-row.is-hl { background: var(--tg-choiceHover); }
.s-row > .check { position: absolute; left: 8px; top: 50%; margin-top: -9px; }
.s-row > .spk { position: absolute; right: 10px; top: 50%; margin-top: -9px; }
.s-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.s-name { font: 13px/1.3 var(--tg-body); color: var(--tg-text); white-space: nowrap; }
.s-row.is-chosen .s-name { font-weight: 600; }
.s-hint { font: 12px/1.3 var(--tg-body); color: var(--tg-muted); white-space: nowrap; }
.s-sep { height: 1px; margin: 0 10px; background: var(--tg-line); flex: none; }
.s-gap { height: 4px; flex: none; }
.s-vol { border-radius: 9px; padding: 4px 10px 8px; display: flex; flex-direction: column; gap: 6px; flex: none; }
.s-vol.is-hl { background: var(--tg-choiceHover); }
.s-vrow { display: flex; justify-content: space-between; font: 13px/1.35 var(--tg-body); }
.s-vrow span:last-child { color: var(--tg-muted); font-variant-numeric: tabular-nums; }
.s-slider { display: flex; align-items: center; gap: 8px; height: 24px; }
.s-track { position: relative; flex: 1; height: 4px; border-radius: 2px; background: var(--tg-line); }
.s-track > i { position: absolute; left: 0; top: 0; height: 100%; border-radius: 2px; background: var(--tg-ink); }
.s-track > b { position: absolute; top: 50%; width: 16px; height: 16px; margin-top: -8px; border-radius: 50%; background: var(--tg-ink); border: 2px solid var(--tg-panel); }
.s-track input { position: absolute; inset: -10px 0; width: 100%; opacity: 0; cursor: pointer; margin: 0; }
.s-note { font: 12px/1.35 var(--tg-body); color: var(--tg-muted); }
.cursor { position: absolute; width: 18px; height: 24px; pointer-events: none; z-index: 9; }

/* --- Component sheets -------------------------------------------------------------------------- */
.sheet { display: grid; gap: 20px 32px; align-items: center; padding: 32px 36px; }
.sh-h { font: 600 11px/1 var(--ui-font); color: var(--tg-muted); letter-spacing: .06em; text-transform: uppercase; }
.sh-r { font: 500 12px/1.3 var(--ui-font); color: var(--tg-muted); }
.sh-c { min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 22px; padding: 32px 36px; }
.var { display: flex; flex-direction: column; gap: 8px; }
.var > .sh-r { font-size: 11px; }
.hrow { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 28px; }

/* --- Documentation frames ---------------------------------------------------------------------- */
.doc { background: var(--doc-paper); color: var(--doc-ink); font: 14px/1.55 var(--ui-font); padding: 56px 64px 52px; }
.eyebrow { font: 600 11px/1 var(--ui-font); letter-spacing: .12em; text-transform: uppercase; color: var(--doc-faint); }
.doc h2 { font: 700 36px/1.1 var(--tg-display); margin: 14px 0 10px; color: var(--doc-ink); text-wrap: balance; letter-spacing: -.01em; }
.doc .lead { margin: 0 0 36px; max-width: 70ch; color: var(--doc-muted); font-size: 15px; }
.doc .src { margin-top: 36px; padding-top: 16px; border-top: 1px solid var(--doc-line); font: 11.5px var(--ui-mono); color: var(--doc-faint); display: flex; flex-wrap: wrap; gap: 6px 20px; }
.doc h3 { margin: 0 0 14px; font: 600 13px/1.2 var(--ui-font); color: var(--doc-ink); }
.cards { display: grid; grid-template-columns: repeat(5, 196px); gap: 16px; }
.ccard { border: 1px solid var(--doc-line); border-radius: 12px; overflow: hidden; background: var(--doc-paper); }
.ccard .duo { display: grid; grid-template-columns: 1fr 1fr; height: 96px; }
.ccard .duo > div { display: flex; flex-direction: column; justify-content: space-between; padding: 9px 10px; font: 500 10.5px/1.2 var(--ui-mono); }
.ccard .duo .mode { font: 600 9.5px/1 var(--ui-font); letter-spacing: .08em; text-transform: uppercase; opacity: .72; }
.ccard .meta { padding: 11px 12px 13px; display: grid; gap: 3px; }
.ccard .name { font: 600 12.5px/1.2 var(--ui-mono); color: var(--doc-ink); }
.ccard .role { color: var(--doc-muted); font-size: 12px; line-height: 1.4; }
.pots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 28px 24px; }
.pot-g h4 { margin: 0 0 12px; font: 600 12px/1.2 var(--ui-font); color: var(--doc-ink); }
.pot-g .row { display: flex; flex-wrap: wrap; gap: 14px; }
.pot { display: grid; justify-items: center; gap: 6px; width: 72px; text-align: center; }
.pot i { width: 52px; height: 52px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .1); }
.pot b { font: 600 10.5px/1.2 var(--ui-mono); color: var(--doc-ink); word-break: break-all; }
.pot span { font: 10.5px/1 var(--ui-mono); color: var(--doc-muted); }
.ctab { width: 100%; border-collapse: collapse; font-size: 13px; }
.ctab th { text-align: left; font: 600 11px/1 var(--ui-font); letter-spacing: .06em; text-transform: uppercase; color: var(--doc-faint); padding: 0 12px 12px 0; }
.ctab td { padding: 10px 12px 10px 0; border-top: 1px solid var(--doc-line); vertical-align: middle; }
.ctab .pair { display: flex; align-items: center; gap: 10px; }
.sample { width: 64px; height: 36px; border-radius: 7px; display: grid; place-items: center; font: 700 15px var(--tg-body); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .08); flex: none; }
.ratio { font: 600 13px var(--ui-mono); font-variant-numeric: tabular-nums; min-width: 52px; }
.badge { font: 700 10px/1 var(--ui-font); letter-spacing: .04em; padding: 4px 6px; border-radius: 4px; white-space: nowrap; }
.badge.aaa, .badge.aa { background: #E3F4EA; color: #1F6B42; }
.badge.large { background: #FBF0D4; color: #7A5A0F; }
.badge.fail { background: #F8E1E2; color: #A1282E; }
.ttab { display: grid; grid-template-columns: 1.6fr repeat(5, auto); gap: 0 28px; align-items: center; }
.ttab > div { padding: 14px 0; border-top: 1px solid var(--doc-line); font-size: 12.5px; color: var(--doc-muted); }
.ttab > .th { border-top: 0; padding-top: 0; font: 600 11px/1 var(--ui-font); letter-spacing: .06em; text-transform: uppercase; color: var(--doc-faint); }
.ttab .spec { color: var(--doc-ink); }
.ttab .tnum { font-variant-numeric: tabular-nums; font-family: var(--ui-mono); font-size: 12px; }
.igrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; }
.itile { border: 1px solid var(--doc-line); border-radius: 12px; height: 104px; display: grid; justify-items: center; align-content: center; gap: 10px; color: var(--doc-accent); }
.itile span { font: 500 11px/1 var(--ui-mono); color: var(--doc-muted); }
.trio { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 48px; }
.radii { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.radius { display: grid; gap: 8px; }
.radius i { height: 64px; background: var(--doc-soft); border: 1.5px solid var(--doc-accent); }
.radius b { font: 600 12px var(--ui-mono); }
.radius span { color: var(--doc-muted); font-size: 12px; line-height: 1.35; }
.space { display: grid; gap: 10px; }
.space div { display: grid; grid-template-columns: 40px 1fr; align-items: center; gap: 10px; font-size: 12px; color: var(--doc-muted); }
.space b { font: 600 12px var(--ui-mono); color: var(--doc-ink); }
.space i { display: block; height: 14px; background: #F6C6B8; border-radius: 2px; }
.elev { display: grid; gap: 22px; }
.elev .demo { position: relative; height: 84px; border-radius: 14px; background: #FBFAF7; border: 1px solid #D5DBE6; display: grid; place-items: center; font-size: 12px; color: var(--doc-muted); }
.mtab { display: grid; grid-template-columns: 1.3fr .7fr 96px 2.2fr; gap: 0 24px; align-items: center; }
.mtab > div { padding: 12px 0; border-top: 1px solid var(--doc-line); font-size: 13px; color: var(--doc-muted); }
.mtab > .th { border-top: 0; padding-top: 0; font: 600 11px/1 var(--ui-font); letter-spacing: .06em; text-transform: uppercase; color: var(--doc-faint); }
.mtab .nm { color: var(--doc-ink); font-weight: 600; }
.mtab .tnum { font-family: var(--ui-mono); font-size: 12px; color: var(--doc-ink); }
.curve { width: 96px; height: 40px; display: block; }
.curve path { fill: none; stroke: var(--doc-accent); stroke-width: 2; }
.curve line { stroke: var(--doc-line); stroke-width: 1; }

/* --- Cover and contents ------------------------------------------------------------------------ */
.cover {
  position: relative; width: 1600px; height: 1000px; padding: 72px 88px; color: #F4EDE1; overflow: hidden;
  background: radial-gradient(1000px 640px at 74% 52%, rgba(74, 114, 204, .30), transparent 62%),
              radial-gradient(900px 600px at 10% 110%, rgba(210, 162, 76, .10), transparent 60%), #111827;
}
.cv-top { display: flex; align-items: center; gap: 14px; }
.cv-mark { width: 44px; height: 44px; border-radius: 12px; background: rgba(255, 255, 255, .06); display: grid; place-items: center; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .08); }
.cv-eyebrow { font: 600 13px/1 var(--ui-font); letter-spacing: .16em; text-transform: uppercase; color: #8FB2EC; }
.cv-date { margin-left: auto; font: 500 13px/1 var(--ui-font); color: #7F8AA0; font-variant-numeric: tabular-nums; }
.cv-title { margin: 70px 0 0; font: 700 176px/.92 var(--tg-display); letter-spacing: -.035em; color: #F4EDE1; }
.cv-tag { margin: 26px 0 0; max-width: 24ch; font: italic 38px/1.2 var(--tg-display); color: #C9D2E3; text-wrap: balance; }
.cv-lead { margin: 26px 0 0; max-width: 52ch; font: 17px/1.6 var(--ui-font); color: #9AA4B8; }
.cv-meta { position: absolute; left: 88px; right: 88px; bottom: 72px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 32px; margin: 0; padding-top: 22px; border-top: 1px solid rgba(255, 255, 255, .1); }
.cv-meta dt { font: 600 11px/1 var(--ui-font); letter-spacing: .12em; text-transform: uppercase; color: #7F8AA0; margin-bottom: 10px; }
.cv-meta dd { margin: 0; font: 15px/1.5 var(--ui-font); color: #DDE3EE; }
.cv-ladder { position: absolute; right: 76px; top: 404px; display: flex; align-items: flex-end; gap: 4px; }
.cv-ladder::after { content: ""; position: absolute; left: -28px; right: -28px; bottom: 72px; height: 1px; background: linear-gradient(90deg, transparent, rgba(224, 181, 78, .65) 14%, rgba(224, 181, 78, .65) 86%, transparent); }
.cv-rank { display: grid; justify-items: center; gap: 0; width: 140px; }
.cv-rname { margin-top: 26px; font: 700 15px/1 var(--tg-display); color: #F4EDE1; }
.cv-rpts { margin-top: 7px; font: 500 12px/1 var(--ui-font); color: #E0B54E; font-variant-numeric: tabular-nums; }
.toc { width: 760px; min-height: 1000px; }
.toc ol { list-style: none; margin: 8px 0 0; padding: 0; counter-reset: p; }
.toc li { display: grid; grid-template-columns: 34px 1fr auto; gap: 4px 12px; padding: 16px 0; border-top: 1px solid var(--doc-line); counter-increment: p; cursor: pointer; }
.toc li::before { content: counter(p, decimal-leading-zero); font: 600 12px/1.6 var(--ui-mono); color: var(--doc-faint); }
.toc li b { font: 700 18px/1.3 var(--tg-display); color: var(--doc-ink); }
.toc li span { grid-column: 2; color: var(--doc-muted); font-size: 13.5px; }
.toc li em { grid-row: 1; grid-column: 3; font: 500 12px/1.6 var(--ui-mono); font-style: normal; color: var(--doc-faint); }
.toc li:hover b { color: var(--doc-accent); }
.howto { margin-top: 28px; padding: 18px 20px; border-radius: 12px; background: var(--doc-soft); display: grid; gap: 8px; color: var(--doc-muted); font-size: 13px; }
.howto b { color: var(--doc-ink); }

/* --- Character page ---------------------------------------------------------------------------- */
.ladder { display: flex; align-items: flex-end; gap: 28px; padding: 56px 56px 44px; }
.rung { width: 196px; display: grid; justify-items: center; text-align: center; }
.rung .base { width: 100%; height: 1px; background: var(--tg-line); margin: 6px 0 18px; }
.rung h4 { margin: 0; font: 700 21px/1.1 var(--tg-display); color: var(--tg-text); }
.rung .pts { margin-top: 6px; font: 600 12px/1 var(--tg-body); color: var(--tg-gold); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.rung p { margin: 10px 0 0; font: 12.5px/1.45 var(--tg-body); color: var(--tg-muted); min-height: 36px; }
.rung .at { margin-top: 10px; font: 11px/1 var(--tg-body); color: var(--tg-muted); }
.rung .at b { color: var(--tg-text); font-weight: 600; }
.matrix { display: grid; grid-template-columns: 120px repeat(7, 128px); gap: 0; padding: 40px 44px 44px; }
.matrix .mh { padding: 0 6px 16px; font: 600 12px/1.3 var(--tg-body); color: var(--tg-text); text-align: center; }
.matrix .mh span { display: block; font-weight: 400; font-size: 11px; color: var(--tg-muted); margin-top: 3px; }
.matrix .rh { display: grid; align-content: center; font: 700 15px/1.2 var(--tg-display); color: var(--tg-text); border-top: 1px solid var(--tg-line); }
.matrix .rh span { font: 400 11px/1.3 var(--tg-body); color: var(--tg-muted); margin-top: 4px; }
.matrix .mc { display: grid; place-items: end center; height: 150px; border-top: 1px solid var(--tg-line); padding-bottom: 6px; }
.icons { display: grid; gap: 28px; }
.icons .row { display: grid; grid-template-columns: 110px repeat(6, 1fr); align-items: center; gap: 12px; }
.icons .row > span { font: 500 12px var(--ui-mono); color: var(--doc-muted); }
.icons .cell { display: grid; place-items: center; }
.icons .names { font: 700 14px/1.2 var(--tg-display); color: var(--doc-ink); text-align: center; }
.trays { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 8px; }
.tray { height: 48px; border-radius: 10px; display: flex; align-items: center; justify-content: flex-end; gap: 16px; padding: 0 18px; font: 12px var(--tg-body); }
.tray.light { background: #EEF0F3; color: #1B1B1B; box-shadow: inset 0 0 0 1px #DADDE2; }
.tray.dark { background: #1F2024; color: #F2F2F2; }
.story { display: flex; align-items: flex-end; gap: 0; }
.shot { position: relative; display: grid; place-items: end center; width: 230px; height: 300px; padding-bottom: 30px; }
.shot .silh > svg { filter: brightness(0) invert(1) drop-shadow(0 0 6px rgba(255, 255, 255, .9)) drop-shadow(0 0 16px rgba(143, 178, 236, .8)); }
.shot .ghost { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); opacity: .45; }
.rays { position: absolute; left: 50%; bottom: 92px; width: 340px; height: 340px; transform: translate(-50%, 50%); border-radius: 50%;
  background: repeating-conic-gradient(from 0deg, rgba(255, 236, 190, .55) 0deg 5deg, transparent 5deg 22.5deg);
  -webkit-mask: radial-gradient(circle, #000 0 18%, rgba(0, 0, 0, .7) 34%, transparent 66%); mask: radial-gradient(circle, #000 0 18%, rgba(0, 0, 0, .7) 34%, transparent 66%); }
.flash { position: absolute; left: 50%; bottom: 100px; width: 420px; height: 420px; transform: translate(-50%, 50%); border-radius: 50%;
  background: radial-gradient(circle, #FFFFFF 0 22%, rgba(255, 255, 255, .85) 34%, rgba(255, 244, 214, .35) 52%, transparent 70%); }
.tstamp { position: absolute; left: 16px; top: 14px; font: 600 11px/1 var(--tg-body); color: var(--tg-muted); letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.tstamp b { color: var(--tg-text); }

/* --- Placement diagram, desktops --------------------------------------------------------------- */
.diag svg { display: block; }
.diag text { font-family: var(--ui-font); }
.screen { position: relative; width: 1440px; height: 900px; overflow: hidden; }
.wall-light { background: radial-gradient(900px 620px at 72% 18%, #FFFFFF 0, rgba(255, 255, 255, 0) 60%), radial-gradient(1200px 800px at 15% 100%, #B9CDEB 0, rgba(185, 205, 235, 0) 62%), linear-gradient(160deg, #DCE7F6, #C7D7EE 55%, #D9E3F2); }
.wall-dark { background: radial-gradient(900px 620px at 72% 18%, rgba(72, 108, 190, .55) 0, rgba(72, 108, 190, 0) 60%), radial-gradient(1200px 800px at 15% 100%, rgba(36, 58, 108, .9) 0, rgba(36, 58, 108, 0) 62%), linear-gradient(160deg, #0E1525, #0A101C 60%, #111B2E); }
.wall-mac { background: radial-gradient(1000px 700px at 30% 20%, #F7E6D2 0, rgba(247, 230, 210, 0) 60%), radial-gradient(1100px 760px at 85% 90%, #BCC9E9 0, rgba(188, 201, 233, 0) 62%), linear-gradient(170deg, #EBD9CB, #D8D7E8 55%, #C6D0EA); }
.taskbar { position: absolute; left: 0; right: 0; bottom: 0; height: 48px; display: flex; align-items: center; padding: 0 12px; font: 12px/1.25 'Segoe UI', system-ui, sans-serif; }
.taskbar.light { background: rgba(243, 244, 247, .92); border-top: 1px solid rgba(0, 0, 0, .08); color: #1B1B1B; }
.taskbar.dark { background: rgba(28, 30, 36, .94); border-top: 1px solid rgba(255, 255, 255, .06); color: #F1F1F1; }
.tb-apps { position: absolute; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; }
.tb-app { width: 40px; height: 40px; border-radius: 6px; display: grid; place-items: center; }
.tb-app i { width: 24px; height: 24px; border-radius: 6px; display: block; }
.tb-tray { margin-left: auto; display: flex; align-items: center; gap: 14px; }
.tb-clock { text-align: right; font-variant-numeric: tabular-nums; }
.menubar { position: absolute; left: 0; right: 0; top: 0; height: 28px; display: flex; align-items: center; gap: 18px; padding: 0 14px; font: 13px/1 'Helvetica Neue', Helvetica, Arial, sans-serif; color: #1D1D1F; background: rgba(250, 250, 252, .62); }
.menubar b { font-weight: 700; }
.menubar .r { margin-left: auto; display: flex; align-items: center; gap: 14px; font-variant-numeric: tabular-nums; }
.dock { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); display: flex; gap: 10px; padding: 8px 10px; border-radius: 22px; background: rgba(255, 255, 255, .38); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .45), 0 10px 30px rgba(20, 30, 60, .18); }
.dock i { width: 54px; height: 54px; border-radius: 13px; display: block; }
.onscreen { position: absolute; }

/* --- Prototype --------------------------------------------------------------------------------- */
.proto { position: fixed; inset: 0; z-index: 50; background: #0E1013; color: #E9ECF1; display: grid; grid-template-rows: auto minmax(0, 1fr); }
.pbar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: calc(10px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  border-bottom: 1px solid #23262C;
}
.pbar b { font-weight: 600; }
.pbar .hint { color: #9AA1AD; min-width: 0; }
.pbtn { border: 1px solid #343842; background: #1B1E24; color: #E9ECF1; border-radius: 8px; padding: 6px 11px; cursor: pointer; font-weight: 500; }
.pbtn:hover { background: #252932; }
.pbtn.primary { background: var(--ui-sel); border-color: var(--ui-sel); color: #FFFFFF; }
.pstage { position: relative; overflow: hidden; display: grid; place-items: center; padding: 16px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.pbox { position: relative; flex: none; border-radius: 10px; overflow: hidden; box-shadow: 0 30px 80px rgba(0, 0, 0, .5); }
.pbox > .screen { transform-origin: 0 0; position: absolute; left: 0; top: 0; }
.live-fig { cursor: pointer; touch-action: none; }
.live-fig.evolving > .fig > svg { filter: brightness(0) invert(1) drop-shadow(0 0 6px rgba(255, 255, 255, .95)) drop-shadow(0 0 18px rgba(143, 178, 236, .9)); }
.live-flash { position: absolute; pointer-events: none; border-radius: 50%; background: radial-gradient(circle, #FFFFFF 0 22%, rgba(255, 255, 255, .85) 34%, rgba(255, 244, 214, .35) 52%, transparent 70%); opacity: 0; }
.live-flash.on { animation: flash .8s ease-out both; }
@keyframes flash { 0% { opacity: 0; } 18% { opacity: 1; } 100% { opacity: 0; } }
.live-rays { position: absolute; pointer-events: none; border-radius: 50%; opacity: 0; transition: opacity .4s;
  background: repeating-conic-gradient(from 0deg, rgba(255, 236, 190, .55) 0deg 5deg, transparent 5deg 22.5deg);
  -webkit-mask: radial-gradient(circle, #000 0 18%, rgba(0, 0, 0, .7) 34%, transparent 66%); mask: radial-gradient(circle, #000 0 18%, rgba(0, 0, 0, .7) 34%, transparent 66%); }
.live-rays.on { opacity: 1; animation: turn 6s linear infinite; }
@keyframes turn { to { transform: rotate(360deg); } }
.proto .glyph.spin { animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.proto .m-busy > i { animation: run 1.2s linear infinite; }
@keyframes run { from { left: -35%; } to { left: 100%; } }
.proto .caret { animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.pop-in { animation: popin .2s cubic-bezier(.22, 1, .36, 1) both; }
@keyframes popin { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
.bubble-in { animation: bubblein .18s ease-out both; }
@keyframes bubblein { from { opacity: 0; } to { opacity: 1; } }
.gone { display: grid; place-items: center; gap: 12px; text-align: center; color: #1B2232; font: 15px var(--ui-font); }

/* --- Narrow screens ---------------------------------------------------------------------------- */
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "bar" "canvas"; }
  .mbar {
    grid-area: bar; display: flex; align-items: center; gap: 8px; background: var(--ui-panel); border-bottom: 1px solid var(--ui-line); z-index: 6;
    padding: calc(8px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 8px max(16px, env(safe-area-inset-left, 0px));
  }
  .mbar .ttl { min-width: 0; flex: 1; display: grid; }
  .mbar .ttl b { font-size: 13px; }
  .mbar .ttl span { color: var(--ui-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mbtn { border: 1px solid var(--ui-line); background: var(--ui-panel); border-radius: 8px; height: 34px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-weight: 500; flex: none; }
  .mbtn.primary { background: var(--ui-sel); border-color: var(--ui-sel); color: var(--ui-on-sel); }
  .panel.left, .panel.right { position: fixed; top: 0; bottom: 0; width: min(88vw, 340px); z-index: 20; box-shadow: var(--ui-shadow); transition: transform .22s ease; }
  .panel.left { left: 0; transform: translateX(-105%); }
  .panel.right { right: 0; transform: translateX(105%); }
  .app.show-left .panel.left, .app.show-right .panel.right { transform: none; }
  .zoom-hide { display: none; }
}
@media (prefers-reduced-motion: reduce) {

}

function glyph(name, tint = 'var(--tg-muted)', size = 18, cls = '') {

// Each inline SVG gets ids of its own, or its glow filter would point at another figure's.
let uid = 0;
const GLOW = /<defs><filter id="glow"[\s\S]*?<\/defs><path [^>]*filter="url\(#glow\)"\/>/;
function art(svg, glow = true) {
  const k = 'k' + (++uid);
  return (glow ? svg : svg.replace(GLOW, ''))
    .replace(/\bid="([^"]+)"/g, `id="$1-${k}"`)
    .replace(/url\(#([^)]+)\)/g, `url(#$1-${k})`);
}

  return `<div class="fig${o.cls ? ' ' + o.cls : ''}" style="width:${w}px;height:${Math.round(w * 176 / 150)}px"${o.attrs || ''}>`
    + `${art(ART.fig[stage][expr], o.glow !== false)}</div>`;
}
const tagIcon = (stage, size) => `<span class="ico" style="width:${size}px;height:${size}px">${art(ART.icon[stage])}</span>`;
const act = a => a ? ` data-act="${esc(a)}" role="button" tabindex="0"` : '';

// --- Bubble.qml ---------------------------------------------------------------------------------
function action(label, o = {}) {
  const cls = ['tg-action', o.primary && 'is-primary', o.hover && 'is-hover', o.ready === false && 'is-off'].filter(Boolean).join(' ');
  return `<span class="${cls}"${o.ready === false ? '' : act(o.act)}${o.m ? ` data-m="${o.m}"` : ''}>${esc(label)}</span>`;
}
const link = (text, o = {}) => `<span class="tg-link${o.hover ? ' is-hover' : ''}"${act(o.act)}>${esc(text)}</span>`;

function field(placeholder, o = {}) {
  if (o.input) {
    return `<input class="tg-field" id="${o.input}" data-input="${o.input}" value="${esc(o.value || '')}" placeholder="${esc(placeholder)}" autocomplete="off" spellcheck="false" aria-label="${esc(placeholder)}">`;
  }
  const inner = o.value
    ? `<span class="f-text">${esc(o.value)}</span>${o.focus ? '<i class="caret"></i>' : ''}`
    : `${o.focus ? '<i class="caret at-start"></i>' : ''}<span class="f-ph">${esc(placeholder)}</span>`;
  return `<span class="tg-field${o.focus ? ' is-focus' : ''}">${inner}</span>`;
}
const fieldRow = (placeholder, o = {}) => `<div class="f-row">${field(placeholder, o)}${action('OK', { primary: true, ready: !!o.ok, act: o.okAct })}</div>`;

function choice(ch, o = {}) {
  return `<div class="b-choice${o.on ? ' is-on' : ''}${o.hover ? ' is-hover' : ''}"${act(o.act)}${o.m ? ` data-m="${o.m}"` : ''}>`
    + `<b>${esc(ch.letter)}</b><span>${esc(ch.text)}</span></div>`;
}
function course(x, current, o = {}) {
  const cls = ['b-course', x.key === current && 'is-on', x.removable && 'can-x', o.hover === x.key && 'is-hover'].filter(Boolean).join(' ');
  const cross = x.removable ? `<i class="b-x${o.xHover === x.key ? ' is-hover' : ''}"${act(o.live && 'putaway:' + x.key)} aria-label="Put ${esc(x.label)} away"></i>` : '';
  return `<span class="${cls}"${act(o.live && 'course:' + x.key)}>${esc(x.label)}${cross}</span>`;

const domainColour = rate => rate >= 0.7 ? 'var(--tg-good)' : rate >= 0.5 ? 'var(--tg-gold)' : 'var(--tg-bad)';

// c: what the controller sends (controller.bubble); u: what the bubble itself holds (picked
// choices, words typed, hover) and, in the prototype, `live` for clickable parts.
function bubble(c, u = {}) {
  const L = u.live;
  const tail = u.tailLeft ? ' tail-left' : '';
  if (c.mode === 'quip') {
    return `<div class="tg-bubble is-quip${tail}"><div class="b-tail"></div><div class="b-panel"></div><div class="b-cover"></div>`
      + `<div class="q-text">${esc(c.text)}</div></div>`;
  }
  const P = [];
  const m = c.mode;
  const titleColour = m === 'result' ? (c.correct ? 'var(--tg-good)' : 'var(--tg-bad)') : 'var(--tg-text)';
  P.push(`<div class="b-head" data-m="head"><div class="b-title" style="color:${titleColour}">${esc(c.title)}</div>`
    + `${c.tag ? `<span class="b-chip">${esc(c.tag)}</span>` : ''}</div>`);
  if (m === 'question') {
    const picked = u.picked || [];
    P.push(`<div class="b-meta" data-m="meta">${esc(c.meta)}</div>`);
    P.push(`<div class="b-para b-14">${esc(c.stem)}</div>`);
    c.choices.forEach((ch, i) => P.push(choice(ch, { on: picked.includes(i), hover: u.hover === i, act: L && 'pick:' + i, m: i === 0 ? 'choice' : '' })));
    if (c.hint) P.push(`<div class="b-para b-note">${esc(c.hint)}</div>`);
    P.push(`<div class="b-bar" data-m="bar"><div class="b-links">${link('Later', { act: L && 'later' })}${link('Wrong question? Report it', { act: L && 'flag', hover: u.linkHover })}</div>`
      + `${c.need > 1 ? action('Confirm', { primary: true, ready: picked.length === c.need, act: L && 'confirm' }) : ''}</div>`);
  } else if (m === 'result' || m === 'thinking') {
    for (const x of c.chosen || []) P.push(`<div class="b-para"><b>${esc(x.letter)}. ${esc(x.text)}</b>: ${esc(x.why)}</div>`);
    P.push(`<div class="b-para">${c.correct ? '' : `The right answer: <b>${esc(c.right)}</b>. `}${esc(c.explanation)}</div>`);
    if (c.reference) P.push(`<div class="b-para b-note b-italic">Read again: ${esc(c.reference)}</div>`);
    if (c.news && !c.promoted) P.push(`<div class="b-para b-news">${esc(c.news)}</div>`);
    if (c.promoted && u.evolving) P.push('<div class="b-para b-news">What? Tagnan is changing!</div>');
    if (c.promoted && !u.evolving) {
      P.push(`<div class="b-rank"><div class="b-rank-over">NEW RANK</div><div class="b-rank-name${u.arrive ? ' arrive' : ''}">${esc((c.rank || '').toUpperCase())}</div>`
        + `<div class="b-para">${esc(c.news)}</div></div>`);
    }
    P.push(`<div class="b-para b-note">${esc(c.points)}</div>`);
    const buttons = [action(c.correct ? 'Continue' : 'Got it', { primary: true, act: L && 'dismiss' })];
    if (m === 'result' && !c.correct) buttons.push(action('Tell me more', { act: L && 'more', hover: u.moreHover }));
    if (m === 'thinking') buttons.push(`<span class="b-thinking">Tagnan is thinking${'.'.repeat(u.dots || 3)}</span>`);
    P.push(`<div class="b-bar"><div class="b-row8">${buttons.join('')}</div>${m === 'result' ? link('Report', { act: L && 'flag' }) : ''}</div>`);
  } else if (m === 'explanation' || m === 'message') {
    P.push(`<div class="b-para b-14">${esc(c.text)}</div>`);
    if (m === 'explanation') P.push(action('Got it', { primary: true, act: L && 'dismiss' }));
    if (m === 'message' && c.button) P.push(action(c.button, { primary: true, act: L && 'dismiss' }));
  } else if (m === 'pause') {
    const pv = u.preview || { ok: false, text: '' };
    P.push(`<div class="b-flow">${c.choices.map(x => action(x.label, { act: L && 'pause:' + x.text, hover: u.hoverChoice === x.text })).join('')}</div>`);
    P.push('<div class="b-para b-note">Or tell me how long, or until when:</div>');
    P.push(fieldRow('1h30, 45 min, 4:45pm, noon…', { value: u.field, focus: u.focus !== false, ok: pv.ok, input: L && 'break-field', okAct: L && 'pause-ok' }));
    if (pv.text) P.push(`<div class="b-para b-12" style="color:${pv.ok ? 'var(--tg-text)' : 'var(--tg-bad)'}">${esc(pv.text)}</div>`);
    if (c.status) P.push(`<div class="b-para b-news">${esc(c.status)}</div>`);
    P.push(`<div class="b-row8">${u.paused ? action('Resume now', { act: L && 'resume' }) : ''}${action('Cancel', { act: L && 'dismiss' })}</div>`);
  } else if (m === 'subject') {
    const cp = u.coursePreview || { ok: false, text: '' };
    const sp = u.subjectPreview || { ok: false, text: '' };
    if ((c.courses || []).length > 1) P.push(`<div class="b-flow">${c.courses.map(x => course(x, c.course, { live: L, hover: u.courseHover, xHover: u.xHover })).join('')}</div>`);
    if (c.putAway && c.putAway.key) P.push(`<div class="b-para b-note">${esc(c.putAway.text)} <a class="b-undo"${act(L && 'undo')}>Undo</a></div>`);
    P.push(fieldRow('Learn something else: an AWS exam, pottery, history…', { value: u.course, focus: u.focus !== false, ok: cp.ok, input: L && 'course-field', okAct: L && 'course-ok' }));
    if (cp.text) P.push(`<div class="b-para b-12" style="color:${cp.ok ? 'var(--tg-text)' : 'var(--tg-bad)'}">${esc(cp.text)}</div>`);
    P.push('<div class="b-line"></div>');
    P.push(`<div class="b-para b-12 b-semi">${esc(c.within)}</div>`);
    P.push(`<div class="b-flow">${c.choices.map(x => action(x.label, { primary: x.key.toLowerCase() === (c.current || '').toLowerCase(), act: L && 'focus:' + x.key })).join('')}</div>`);
    P.push('<div class="b-para b-note">Or a corner of it, in your own words:</div>');
    P.push(fieldRow(c.course === 'aif-c01' ? 'RAG, Bedrock Guardrails, prompt engineering…' : 'A corner of it, in your own words…', { value: u.subject, focus: false, ok: sp.ok, input: L && 'subject-field', okAct: L && 'subject-ok' }));
    if (sp.text) P.push(`<div class="b-para b-12" style="color:${sp.ok ? 'var(--tg-text)' : 'var(--tg-bad)'}">${esc(sp.text)}</div>`);
    P.push(`<div class="b-para b-news">${esc(c.status)}</div>`);
    P.push(action('Cancel', { act: L && 'dismiss' }));
  } else if (m === 'stats') {
    P.push(`<div class="b-para"><b>${esc(c.points)} points</b> · ${esc(c.next)}</div>`);
    P.push(`<div class="b-prog"><i style="width:${(c.share * 100).toFixed(1)}%"></i></div>`);
    P.push(`<div class="b-para b-note">${esc(c.streak)} · ${esc(c.answers)}</div>`);
    for (const d of c.domains) {
      P.push(`<div class="b-dom"><span class="n">${esc(d.name)}</span><span class="c">${esc(d.count)}</span>`
        + `<i class="t"><i style="width:${d.rate < 0 ? 0 : (d.rate * 100).toFixed(1)}%;background:${domainColour(d.rate)}"></i></i></div>`);
    }
    P.push(`<div class="b-para b-note">${esc(c.bank)}</div>`);
    P.push(`<div class="b-row8">${action('A question', { primary: true, act: L && 'ask' })}${action(u.paused ? 'Resume' : 'A break…', { act: L && (u.paused ? 'resume' : 'showpause') })}${action('Close', { act: L && 'dismiss' })}</div>`);
  }
  return `<div class="tg-bubble${tail}" data-m="bubble"><div class="b-shadow"></div><div class="b-tail" data-m="tail"></div><div class="b-panel"></div><div class="b-cover"></div>`
    + `<div class="b-col" data-m="col">${P.join('')}</div></div>`;
}

// --- TagnanMenu.qml -----------------------------------------------------------------------------
function commandRows(c) {
  const list = [
    { action: 'ask', label: 'A question now', value: c.next, icon: 'ask', primary: true },
    { action: 'stats', label: 'Progress', icon: 'stats' },
    { action: 'subject', label: 'Subject', value: c.subject, icon: 'subject' },
    { separator: true },
    { action: 'sub:pace', label: 'How often', value: c.pace, icon: 'pace', more: true },
    { action: 'sub:call', label: 'Sound', value: c.sound, icon: 'call', more: true },
    { action: 'sub:model', label: 'Questions by', value: c.model, icon: 'model', more: true },
    { separator: true },
  ];
  if (c.paused) {
    list.push({ action: 'resume', label: 'Resume now', value: c.next, icon: 'resume' });
    list.push({ action: 'pause', label: 'Change the break…', icon: 'pause' });
  } else {
    list.push({ action: 'pause', label: 'A break…', icon: 'pause' });
  }
  const up = c.update;
  if (up) list.push({ action: 'update', label: up.label, value: up.value, icon: up.busy ? 'spinner' : 'update', pill: up.pill, busy: up.busy, strong: up.strong });
  list.push({ action: 'quit', label: 'Quit Tagnan', icon: 'quit', quiet: true });
  return list;
}
function suggestionRows(found) {
  return found.map(s => {
    const verb = s.action.split(':')[0];
    const name = verb === 'theme' ? (s.action === 'theme:dark' ? 'moon' : 'sun')
      : ({ pace: 'pace', call: 'call', pause: 'pause', learn: 'learn', focus: 'focus' })[verb] || verb;
    return { action: s.action, label: s.label, value: s.sub, icon: ICONS[name] ? name : 'search' };
  });
}
function menuRow(r, i, u, typed) {
  if (r.separator) return '<div class="m-sep" data-m="sep"></div>';
  const on = u.current === i;
  const two = typed && !!r.value;
  const tint = r.primary ? 'var(--tg-panel)' : r.strong ? 'var(--tg-gold)' : r.busy ? 'var(--tg-ink)' : 'var(--tg-muted)';
  const cls = ['m-row', r.primary && 'is-primary', on && !r.primary && 'is-hl', on && r.primary && u.keyboard && 'is-ring',
    two && 'is-two', r.quiet && 'is-quiet', r.strong && 'is-strong'].filter(Boolean).join(' ');
  const value = two ? '' : r.pill ? `<span class="m-pill">${esc(r.value)}</span>`
    : (r.value || r.more) ? `<span class="m-value">${esc((r.value || '') + (r.more ? '  ›' : ''))}</span>` : '';
  const label = two ? `<span class="m-two"><span class="m-label">${esc(r.label)}</span><span class="m-sub">${esc(r.value)}</span></span>`
    : `<span class="m-label">${esc(r.label)}</span>`;
  return `<div class="${cls}" data-row="${i}"${act(u.live && 'row:' + i)}${r.primary ? ' data-m="primary"' : ''}>${glyph(r.icon, tint, 18, r.busy ? 'spin' : '')}${label}${value}`
    + `${r.busy ? '<span class="m-busy"><i></i></span>' : ''}</div>`;
}
const choicesOf = (c, which) => which === 'pace' ? c.paces : which === 'call' ? c.calls : which === 'model' ? c.models : [];
const chosenOf = (c, which) => which === 'pace' ? c.paceKey : which === 'call' ? c.callKey : c.modelKey;
function sublist(c, u) {
  const which = u.sub;
  const list = choicesOf(c, which);
  const chosen = chosenOf(c, which);
  const current = u.subCurrent ?? Math.max(0, list.findIndex(x => x.key === chosen));
  const title = { pace: 'How often?', call: 'His call', model: 'Who writes his questions?' }[which];
  const subtitle = which === 'call' ? 'A click plays it and keeps it.' : which === 'model' ? 'From his next batch on.' : '';
  const rows = list.map((x, i) => {
    const isChosen = x.key === chosen;
    const cls = ['s-row', x.hint && 'has-hint', current === i && 'is-hl', isChosen && 'is-chosen'].filter(Boolean).join(' ');
    return `<div class="${cls}"${act(u.live && 'choose:' + i)}>${isChosen ? glyph('check', 'var(--tg-ink)', 18, 'check') : ''}`
      + `<span class="s-text"><span class="s-name">${esc(x.name)}</span>${x.hint ? `<span class="s-hint">${esc(x.hint)}</span>` : ''}</span>`
      + `${which === 'call' && x.key !== 'silent' ? glyph('call', current === i ? 'var(--tg-ink)' : 'var(--tg-muted)', 18, 'spk') : ''}</div>`;
  }).join('');
  const volume = which !== 'call' ? '' : '<div class="s-sep"></div><div class="s-gap"></div>'
    + `<div class="s-vol${current === list.length ? ' is-hl' : ''}"><div class="s-vrow"><span>Volume</span><span>${c.volume} %</span></div>`
    + `<div class="s-slider">${glyph('soft')}<span class="s-track"><i style="width:${c.volume}%"></i><b style="left:calc(${c.volume / 100} * (100% - 16px))"></b>`
    + `${u.live ? `<input type="range" min="0" max="100" step="5" value="${c.volume}" data-input="volume" aria-label="Volume">` : ''}</span>${glyph('loud')}</div>`
    + '<div class="s-note">Let go to hear it.</div></div>';
  return `<div class="m-subpanel${u.subLeft ? ' is-left' : ''}" data-subrow="${u.subRow}" data-m="list"><div class="s-title">${title}</div>`
    + `${subtitle ? `<div class="s-subtitle">${subtitle}</div>` : ''}${rows}${volume}</div>`;
}
// c: menu.content (tagnan/ui/menu.py); u: the row the mouse or the arrows are on, the words
// typed and their suggestions, the list open beside.
function menu(c, u = {}) {
  const typed = (u.typed || '').trim() !== '';
  const rows = typed ? suggestionRows(u.suggestions || []) : commandRows(c);
  const head = `<div class="m-head" data-m="head">${tagIcon(c.stage, 40)}<div class="m-hcol"><div class="m-grade">${esc(c.grade)}</div>`
    + `<div class="m-bar"><i style="width:${(c.share * 100).toFixed(1)}%"></i></div><div class="m-points">${esc(c.points)}</div></div>`
    + `<span class="m-theme${u.themeHover ? ' is-hover' : ''}"${act(u.live && 'theme')} aria-label="Dark or light">`
    + `<span class="when-light">${glyph('moon', 'var(--tg-ink)')}</span><span class="when-dark">${glyph('sun', 'var(--tg-ink)')}</span></span></div>`;
  const input = u.live ? `<input id="menu-field" data-input="menu" value="${esc(u.typed || '')}" placeholder="Type: break 45, often, learn pottery…" autocomplete="off" spellcheck="false" aria-label="Tell Tagnan what to do">`
    : typed ? `<span>${esc(u.typed)}</span><i class="caret"></i>` : `<i class="caret at-start"></i><span class="f-ph">Type: break 45, often, learn pottery…</span>`;
  const fieldHtml = `<div class="m-field${typed ? ' is-typing' : ''}" data-m="field">${glyph('search')}${input}</div>`;
  const nomatch = typed && rows.length === 0 ? '<div class="m-nomatch">I don’t follow. Try “break 1h”, “often”, “bell” or “learn pottery”.</div>' : '';
  return `<div class="tg-menu"><div class="m-panel" data-m="menu">${head}${fieldHtml}<div class="m-gap"></div>${nomatch}`
    + `${rows.map((r, i) => menuRow(r, i, u, typed)).join('')}</div>${u.sub ? sublist(c, u) : ''}</div>`;
}
// The list beside starts at its row, 8 px higher (TagnanMenu.qml, openSub); the frame grows to
// hold it when it reaches lower than the menu.
function placeSublists(root) {
  for (const sub of $$('.m-subpanel', root)) {
    const menuEl = sub.parentElement;
    const panel = $('.m-panel', menuEl);
    const row = $(`.m-row[data-row="${sub.dataset.subrow}"]`, panel);
    if (!row) continue;
    const top = row.offsetTop + 1 - 8;
    sub.style.top = top + 'px';
    if (!menuEl.closest('.onscreen')) menuEl.style.minHeight = Math.max(panel.offsetHeight, top + sub.offsetHeight) + 'px';
  }
}

function rgbOf(css) {

    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16), 1];
  }
  const m = css.match(/rgba?\(([^)]+)\)/);
  const p = m ? m[1].split(',').map(Number) : [0, 0, 0, 1];
  return [p[0], p[1], p[2], p[3] ?? 1];
}

  const [r, g, b, a] = rgbOf(top);
  const [R, G, B] = rgbOf(base);
  return `rgb(${Math.round(r * a + R * (1 - a))}, ${Math.round(g * a + G * (1 - a))}, ${Math.round(b * a + B * (1 - a))})`;
}

  return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b);

function quipOnDesk(text, stage, expr) {
  return `<div class="scene" style="padding:28px 32px 22px 28px">${bubble({ mode: 'quip', text })}${figure(stage, expr)}</div>`;
}
function measures(body, items) {
  // Redlines over a component: horizontal or vertical dimensions between element edges.
  const z = view.z;
  const base = body.getBoundingClientRect();
  const R = el => { const r = el.getBoundingClientRect(); return { l: (r.left - base.left) / z, t: (r.top - base.top) / z, r: (r.right - base.left) / z, b: (r.bottom - base.top) / z }; };
  const parts = [];
  const pill = (x, y, text) => {
    const w = 8 + text.length * 6.6;
    parts.push(`<rect x="${x - w / 2}" y="${y - 9}" width="${w}" height="18" rx="4" fill="var(--ui-red)"/><text x="${x}" y="${y + 4}" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="600" font-family="Inter, Segoe UI, sans-serif">${text}</text>`);
  };
  for (const it of items) {
    const a = $(it.a, body), b = it.b ? $(it.b, body) : null;
    if (!a) continue;
    const A = R(a), B = b ? R(b) : null;
    let x1, x2, y1, y2;
    if (it.h) { // horizontal: from one x edge to another, at height y
      x1 = it.h[0](A, B); x2 = it.h[1](A, B); y1 = y2 = it.at(A, B);
      parts.push(`<path d="M${x1} ${y1}H${x2}M${x1} ${y1 - 5}v10M${x2} ${y1 - 5}v10" stroke="var(--ui-red)" stroke-width="1"/>`);
      const label = it.label || String(Math.round(Math.abs(x2 - x1)));
      if (it.outside) pill(Math.min(x1, x2) - 22, y1, label); // a gap too narrow for its number
      else pill((x1 + x2) / 2, y1 - (it.below ? -14 : 14), label);
    } else {
      y1 = it.v[0](A, B); y2 = it.v[1](A, B); x1 = x2 = it.at(A, B);
      parts.push(`<path d="M${x1} ${y1}V${y2}M${x1 - 5} ${y1}h10M${x1 - 5} ${y2}h10" stroke="var(--ui-red)" stroke-width="1"/>`);
      pill(x1 + (it.left ? -26 : 26), (y1 + y2) / 2, it.label || String(Math.round(Math.abs(y2 - y1))));
    }
  }
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'redlines');
  svg.setAttribute('style', 'position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none');
  svg.innerHTML = parts.join('');
  body.appendChild(svg);
}
function bubbleAnatomy(body) {
  measures(body, [
    { a: '[data-m=bubble]', h: [A => A.l, A => A.r], at: A => A.t - 22, label: '400' },
    { a: '[data-m=bubble]', b: '[data-m=choice]', h: [A => A.l, (A, B) => B.l], at: (A, B) => (B.t + B.b) / 2, outside: true, label: '14' },
    { a: '[data-m=bubble]', b: '[data-m=head]', v: [A => A.t, (A, B) => B.t], at: (A, B) => B.l + 150, label: '14' },
    { a: '[data-m=head]', b: '[data-m=meta]', v: [A => A.b, (A, B) => B.t], at: A => A.r + 36, label: '9' },

}

    + `<text x="984" y="46" fill="${red}" font-size="12" text-anchor="end" font-weight="600">16 px from every edge</text>`
    + menuBox(150, 70, true) + pointer(150, 70)
    + note(318, 90, ['In the middle of the screen', 'it opens below and to the right', 'of the pointer, as menus do.'])
    + `<rect x="676" y="352" width="115" height="136" rx="7" fill="#FBFAF7" stroke="${ink}" stroke-width="1.5"/>`
    + Array.from({ length: 5 }, (_, i) => `<rect x="${686}" y="${376 + i * 22}" width="${70 - (i % 2) * 16}" height="6" rx="3" fill="#D5DBE6"/>`).join('')
    + menuBox(794, 256, false)
    + `<image href="data:image/svg+xml;utf8,${encodeURIComponent(ART.icon[2])}" x="900" y="462" width="70" height="70"/>`
    + pointer(944, 492)

  const bub = (x, y, w, h, tail) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="7" fill="#FBFAF7" stroke="${ink}" stroke-width="1.5"/>`
    + (tail === 'right' ? `<path d="M${x + w} ${y + h - 20}l7 4-7 4" fill="#FBFAF7" stroke="${ink}" stroke-width="1.5"/>` : tail === 'left' ? `<path d="M${x} ${y + h - 20}l-7 4 7 4" fill="#FBFAF7" stroke="${ink}" stroke-width="1.5"/>` : '');
  const mini = (ox, title, sub, draw) => `<g transform="translate(${ox} 0)"><rect x="0" y="0" width="300" height="200" rx="8" fill="#F4F6F9" stroke="${line}"/>${draw}`

    + '<div class="src"><span>tagnan/ui/menu.py: menu_position</span><span>tagnan/ui/placement.py: bubble_position</span></div>';

function taskbar(dark, stage) {
  const ink = dark ? '#F1F1F1' : '#1B1B1B';

  const grid = `<svg width="22" height="22" viewBox="0 0 22 22" fill="${dark ? '#8FB2EC' : '#2B4A8C'}"><rect x="1" y="1" width="9" height="9" rx="2"/><rect x="12" y="1" width="9" height="9" rx="2"/><rect x="1" y="12" width="9" height="9" rx="2"/><rect x="12" y="12" width="9" height="9" rx="2"/></svg>`;
  const wifi = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${ink}" stroke-width="2" stroke-linecap="round"><path d="M2 8.5a15 15 0 0 1 20 0M5 12a10 10 0 0 1 14 0M8.5 15.5a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r="1" fill="${ink}"/></svg>`;
  const vol = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${ink}" stroke-width="2" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9a4 4 0 0 1 0 6" stroke-linecap="round"/></svg>`;
  return `<div class="taskbar ${dark ? 'dark' : 'light'}"><div class="tb-apps"><span class="tb-app">${grid}</span>${apps.map(a => `<span class="tb-app"><i style="background:${a}"></i></span>`).join('')}</div>`
    + `<div class="tb-tray">${trayGlyphs(ink)}${tagIcon(stage, 20)}${wifi}${vol}<div class="tb-clock">15:07<br>19/10/2026</div></div></div>`;
}
function windowsDesktop(o) {
  const fx = FX, fy = FY_WIN;
  return `<div class="screen ${o.dark ? 'wall-dark' : 'wall-light'}">`
    + `<div class="onscreen" style="left:${fx}px;top:${fy}px">${figure(o.stage ?? 2, o.expr || 'idle')}</div>`
    + (o.bubble ? `<div class="onscreen" style="right:${1440 - (fx + 2)}px;bottom:${900 - (fy + 176 - 64)}px">${bubble(o.bubble, o.ui || {})}</div>` : '')
    + (o.menu ? `<div class="onscreen" style="right:${1440 - o.pointer[0]}px;bottom:${900 - o.pointer[1]}px">${menu(o.menu, o.menuUi)}</div>`
      + `<svg class="cursor" style="left:${o.pointer[0]}px;top:${o.pointer[1]}px" viewBox="0 0 18 24"><path d="M1 1l0 18l5-4.8l3.4 7.6l3-1.3l-3.3-7.4l7-.5z" fill="#111" stroke="#FFF" stroke-width="1.3"/></svg>` : '')
    + taskbar(o.dark, o.stage ?? 2) + '</div>';
}
function macDesktop(o) {
  const fx = FX, fy = 900 - 86 - 176 - 8;
  const tiles = ['#5AA0F8', '#F2A93B', '#4FD1A1', '#9B87F5', '#FF8A7A', '#7BC8F6', '#B7BCC7'].map(c => `<i style="background:linear-gradient(160deg,${c},color-mix(in srgb, ${c} 70%, #000))"></i>`).join('');
  return `<div class="screen wall-mac mac">`

    + `<div class="onscreen" style="left:${fx}px;top:${fy}px">${figure(o.stage ?? 2, o.expr || 'idle')}</div>`

    if (str) return colon ? `<span class="k">${str}</span>${colon}` : `<span class="s">${str}</span>`;
    if (num) return `<span class="n">${num}</span>`;
    return `<span class="n">${word}</span>`;
  });
}

// --- Pointer, wheel, keys ----------------------------------------------------------------------
const pointers = new Map();
let pan = null, pinch = null;
canvas.addEventListener('pointerdown', e => {
  if (e.target.closest('.tools, .help, .toast')) return;
  touched = true;
  cancelAnimationFrame(anim);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  if (pointers.size === 2) {
    const [p, q] = [...pointers.values()];
    pinch = { d: Math.hypot(p.x - q.x, p.y - q.y), z: view.z, mx: (p.x + q.x) / 2, my: (p.y + q.y) / 2, vx: view.x, vy: view.y };
    pan = null;
    return;
  }
  pan = { id: e.pointerId, x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, moved: false, target: e.target, button: e.button };
  if (e.button === 1) e.preventDefault();
});
canvas.addEventListener('pointermove', e => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pointers.size === 2) {
    const [p, q] = [...pointers.values()];
    const r = canvas.getBoundingClientRect();
    const z = clamp(pinch.z * Math.hypot(p.x - q.x, p.y - q.y) / pinch.d, MIN_Z, MAX_Z);
    const mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2;
    const wx = (pinch.mx - r.left - pinch.vx) / pinch.z, wy = (pinch.my - r.top - pinch.vy) / pinch.z;
    view.z = z;
    view.x = mx - r.left - wx * z;
    view.y = my - r.top - wy * z;
    moving();
    apply();
    return;
  }
  if (pan && pan.id === e.pointerId) {
    const dx = e.clientX - pan.x, dy = e.clientY - pan.y;
    if (!pan.moved && Math.hypot(dx, dy) > 4) { pan.moved = true; canvas.classList.add('panning'); }
    if (pan.moved) { view.x = pan.vx + dx; view.y = pan.vy + dy; moving(); apply(); }
  } else if (!pan && e.pointerType === 'mouse') {
    const fb = e.target.closest && (e.target.closest('.fbody') || e.target.closest('.flabel'));
    setHover(fb ? fb.dataset.id : null);
  }
});
function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (!pan || pan.id !== e.pointerId) return;
  canvas.classList.remove('panning');
  if (!pan.moved && pan.button === 0 && e.type === 'pointerup') {
    const goto = pan.target.closest && pan.target.closest('[data-goto]');
    const fb = pan.target.closest && (pan.target.closest('.fbody') || pan.target.closest('.flabel'));
    if (goto) renderPage(goto.dataset.goto);
    else if (tool === 'move' && !spaceDown) select(fb ? fb.dataset.id : null);
  }
  pan = null;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('pointerleave', () => setHover(null));
canvas.addEventListener('dblclick', e => {
  const fb = e.target.closest('.fbody') || e.target.closest('.flabel');
  if (fb) select(fb.dataset.id, { zoom: true });
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  touched = true;
  cancelAnimationFrame(anim);
  const r = canvas.getBoundingClientRect();
  const unit = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? r.height : 1;
  if (e.ctrlKey || e.metaKey) {
    const dy = e.deltaY * unit;
    zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-dy * (Math.abs(dy) < 50 ? 0.012 : 0.0022)));
  } else {
    const horizontal = e.shiftKey && !e.deltaX;
    view.x -= (horizontal ? e.deltaY : e.deltaX) * unit;
    view.y -= (horizontal ? 0 : e.deltaY) * unit;
    moving();
    apply();
  }
