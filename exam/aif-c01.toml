# AWS Certified AI Practitioner (AIF-C01): domains, weights and task statements, after the
# official exam guide (version 1.x), with the notions each task covers. The brain draws on them
# to write questions; the game weighs the domains by these percentages.
# Check against the exam guide in force before the exam: AWS updates it now and then.

code = "AIF-C01"
name = "AWS Certified AI Practitioner"
# Question formats the brain may use. The real exam also has ordering, matching and case
# studies; Tagnan sticks to the two that fit in a bubble.
kinds = ["single", "multiple"]
# How the brain writes for this exam, and what a question's reference points to.
guidance = """You write as the exam's authors do: accurate, unambiguous questions about stable \
facts that AWS documents well, AWS services, features and terms named exactly as the AWS \
documentation names them. Hard questions weigh the constraints AWS scenarios turn on: cost, \
latency, security, governance, effort. Never rely on quotas, prices, numeric limits, lists of \
Regions, version numbers or preview features: they change too often. If a fact seems uncertain \
to you, choose another notion."""
reference = "the AWS document to read again, for example \"Amazon Bedrock User Guide, Guardrails\""

services = [
    "Amazon Bedrock", "Amazon Bedrock Knowledge Bases", "Amazon Bedrock Agents",
    "Amazon Bedrock Guardrails", "Amazon Bedrock model evaluation", "PartyRock",
    "Amazon Q Business", "Amazon Q Developer",
    "Amazon SageMaker", "Amazon SageMaker JumpStart", "Amazon SageMaker Canvas",
    "Amazon SageMaker Data Wrangler", "Amazon SageMaker Feature Store",
    "Amazon SageMaker Ground Truth", "Amazon SageMaker Clarify", "Amazon SageMaker Model Monitor",
    "Amazon SageMaker Model Cards", "Amazon SageMaker Model Registry", "Amazon SageMaker Pipelines",
    "Amazon Augmented AI (A2I)", "Amazon Comprehend", "Amazon Kendra", "Amazon Lex",
    "Amazon Personalize", "Amazon Polly", "Amazon Rekognition", "Amazon Textract",
    "Amazon Transcribe", "Amazon Translate", "Amazon Forecast", "Amazon Fraud Detector",
    "Amazon OpenSearch Service", "Amazon Aurora", "Amazon RDS for PostgreSQL",
    "Amazon DocumentDB", "Amazon Neptune", "Amazon S3",
    "AWS Identity and Access Management (IAM)", "AWS Key Management Service (KMS)", "Amazon Macie",
    "AWS PrivateLink", "Amazon VPC", "AWS CloudTrail", "AWS Config", "Amazon Inspector",
    "AWS Audit Manager", "AWS Artifact", "AWS Trusted Advisor", "Amazon CloudWatch",
]

[[domains]]
id = 1
name = "Fundamentals of AI and ML"
weight = 20

[[domains.tasks]]
id = "1.1"
title = "Explain basic AI concepts and terminologies"
notions = """AI, ML, deep learning, neural networks, computer vision, natural language \
processing (NLP), model, algorithm, training and inferencing, bias, fairness, fit, large language \
model (LLM); how AI, ML and deep learning relate; batch and real-time inferencing; labeled and \
unlabeled, tabular, time-series, image, text, structured and unstructured data; supervised, \
unsupervised and reinforcement learning."""

[[domains.tasks]]
id = "1.2"
title = "Identify practical use cases for AI"
notions = """Where AI/ML adds value (assisting human decisions, scalability, automation) and \
where it does not (cost-benefit, a specific outcome needed rather than a prediction); choosing \
regression, classification or clustering; computer vision, NLP, speech recognition, \
recommendation systems, fraud detection, forecasting; what AWS managed AI/ML services do: \
SageMaker, Amazon Transcribe, Amazon Translate, Amazon Comprehend, Amazon Lex, Amazon Polly."""

[[domains.tasks]]
id = "1.3"
title = "Describe the ML development lifecycle"
notions = """Data collection, exploratory data analysis (EDA), data pre-processing, feature \
engineering, model training, hyperparameter tuning, evaluation, deployment, monitoring; open \
source pre-trained models or custom training; managed API service or self-hosted API; \
SageMaker, SageMaker Data Wrangler, SageMaker Feature Store, SageMaker Model Monitor; MLOps \
(experimentation, repeatable processes, scalable systems, technical debt, production \
readiness, monitoring, re-training); model metrics (accuracy, AUC, F1 score) and business \
metrics (cost per user, development costs, customer feedback, ROI)."""

[[domains]]
id = 2
name = "Fundamentals of Generative AI"
weight = 24

[[domains.tasks]]
id = "2.1"
title = "Explain the basic concepts of generative AI"
notions = """Tokens, chunking, embeddings, vectors, prompt engineering, transformer-based LLMs, \
foundation models, multi-modal models, diffusion models; use cases (image, video and audio \
generation, summarization, chatbots, translation, code generation, customer service agents, \
search, recommendation engines); the foundation model lifecycle (data selection, model \
selection, pre-training, fine-tuning, evaluation, deployment, feedback)."""

[[domains.tasks]]
id = "2.2"
title = "Understand the capabilities and limitations of generative AI for solving business problems"
notions = """Advantages (adaptability, responsiveness, simplicity); disadvantages \
(hallucinations, interpretability, inaccuracy, nondeterminism); choosing a model (model types, \
performance requirements, capabilities, constraints, compliance); business value and metrics \
(cross-domain performance, efficiency, conversion rate, average revenue per user, accuracy, \
customer lifetime value)."""

[[domains.tasks]]
id = "2.3"
title = "Describe AWS infrastructure and technologies for building generative AI applications"
notions = """Amazon SageMaker JumpStart, Amazon Bedrock, PartyRock, Amazon Q; advantages of AWS \
generative AI services (accessibility, lower barrier to entry, efficiency, cost-effectiveness, \
speed to market); benefits of AWS infrastructure (security, compliance, responsibility, \
safety); cost tradeoffs (responsiveness, availability, redundancy, performance, regional \
coverage, token-based pricing, provisioned throughput, custom models)."""

[[domains]]
id = 3
name = "Applications of Foundation Models"
weight = 28

[[domains.tasks]]
id = "3.1"
title = "Describe design considerations for applications that use foundation models"
notions = """Choosing a pre-trained model (cost, modality, latency, multi-lingual, model size, \
complexity, customization, input/output length); inference parameters (temperature, \
input/output length); Retrieval Augmented Generation (RAG) and its business uses (Amazon \
Bedrock, knowledge bases); storing embeddings in vector databases (OpenSearch Service, Aurora, \
Neptune, DocumentDB, RDS for PostgreSQL); cost tradeoffs of customization (pre-training, \
fine-tuning, in-context learning, RAG); agents for multi-step tasks (Amazon Bedrock Agents)."""

[[domains.tasks]]
id = "3.2"
title = "Choose effective prompt engineering techniques"
notions = """Context, instruction, negative prompts, model latent space; chain-of-thought, \
zero-shot, single-shot, few-shot, prompt templates; best practices (response quality, \
experimentation, guardrails, discovery, specificity and concision); risks (exposure, \
poisoning, hijacking, jailbreaking, prompt injection)."""

[[domains.tasks]]
id = "3.3"
title = "Describe the training and fine-tuning process for foundation models"
notions = """Pre-training, fine-tuning, continuous pre-training; instruction tuning, domain \
adaptation, transfer learning; preparing data (curation, governance, size, labeling, \
representativeness, reinforcement learning from human feedback (RLHF))."""

[[domains.tasks]]
id = "3.4"
title = "Describe methods to evaluate foundation model performance"
notions = """Human evaluation, benchmark datasets, model evaluation in Amazon Bedrock; ROUGE, \
BLEU, BERTScore; whether a model meets business objectives (productivity, user engagement, \
task engineering)."""

[[domains]]
id = 4
name = "Guidelines for Responsible AI"
weight = 14

[[domains.tasks]]
id = "4.1"
title = "Explain the development of AI systems that are responsible"
notions = """Bias, fairness, inclusivity, robustness, safety, veracity; Amazon Bedrock \
Guardrails; responsible model selection (environmental considerations, sustainability); legal \
risks (intellectual property infringement, biased outputs, loss of customer trust, end user \
risk, hallucinations); inclusive, diverse, curated, balanced datasets; effects of bias and \
variance (demographic groups, inaccuracy, overfitting, underfitting); detecting and \
monitoring (label quality, human audits, subgroup analysis, SageMaker Clarify, SageMaker Model \
Monitor, Amazon A2I)."""

[[domains.tasks]]
id = "4.2"
title = "Recognize the importance of transparent and explainable models"
notions = """Transparent and explainable models versus those that are not; SageMaker Model \
Cards, open source models, data and licensing; tradeoffs between safety and transparency \
(interpretability versus performance); human-centered design for explainable AI."""

[[domains]]
id = 5
name = "Security, Compliance, and Governance for AI Solutions"
weight = 14

[[domains.tasks]]
id = "5.1"
title = "Explain methods to secure AI systems"
notions = """IAM roles, policies and permissions, encryption, Amazon Macie, AWS PrivateLink, \
the AWS shared responsibility model; source citation and data origins (data lineage, data \
cataloging, SageMaker Model Cards); secure data engineering (data quality, privacy-enhancing \
technologies, access control, data integrity); application security, threat detection, \
vulnerability management, infrastructure protection, prompt injection, encryption at rest and \
in transit."""

[[domains.tasks]]
id = "5.2"
title = "Recognize governance and compliance regulations for AI systems"
notions = """Standards (ISO, SOC, algorithm accountability laws); AWS Config, Amazon Inspector, \
AWS Audit Manager, AWS Artifact, AWS CloudTrail, AWS Trusted Advisor; data governance (data \
lifecycles, logging, residency, monitoring, observation, retention); governance protocols \
(policies, review cadence and strategies, frameworks such as the Generative AI Security \
Scoping Matrix, transparency standards, team training)."""
