# AWS Certified AI Practitioner (AIF-C01): domains, weights and task statements, after the
# official exam guide (version 1.x), with the notions each task covers. The brain draws on them
# to write questions; the game weighs the domains by these percentages.
# Check against the exam guide in force before the exam: AWS updates it now and then.

code = "AIF-C01"
name = "AWS Certified AI Practitioner"
# Question formats the brain may use. The real exam also has ordering, matching and case
# studies; Tagnan sticks to the two that fit in a bubble.
kinds = ["single", "multiple"]

services = [
    "Amazon Bedrock", "Amazon Bedrock Knowledge Bases", "Amazon Bedrock Agents",
    "Amazon Bedrock Guardrails", "Amazon Bedrock model evaluation", "PartyRock",
    "Amazon Q Business", "Amazon Q Developer",
    "Amazon SageMaker", "Amazon SageMaker JumpStart", "Amazon SageMaker Canvas",
    "Amazon SageMaker Data Wrangler", "Amazon SageMaker Feature Store",
    "Amazon SageMaker Ground Truth", "Amazon SageMaker Clarify", "Amazon SageMaker Model Monitor",
    "Amazon SageMaker Model Cards", "Amazon SageMaker Model Registry", "Amazon SageMaker Pipelines",
    "Amazon Augmented AI (A2I)", "Amazon Comprehend", "Amazon Kendra", "Amazon Lex",
    "Amazon Personalize", "Amazon Polly", "Amazon Rekognition", "Amazon Textract",
    "Amazon Transcribe", "Amazon Translate", "Amazon Forecast", "Amazon Fraud Detector",
    "Amazon OpenSearch Service", "Amazon Aurora", "Amazon RDS for PostgreSQL",
    "Amazon DocumentDB", "Amazon Neptune", "Amazon S3",
    "AWS Identity and Access Management (IAM)", "AWS Key Management Service (KMS)", "Amazon Macie",
    "AWS PrivateLink", "Amazon VPC", "AWS CloudTrail", "AWS Config", "Amazon Inspector",
    "AWS Audit Manager", "AWS Artifact", "AWS Trusted Advisor", "Amazon CloudWatch",
]

[[domains]]
id = 1
name = "Fondamentaux de l'IA et du ML"
weight = 20

[[domains.tasks]]
id = "1.1"
title = "Expliquer les concepts et la terminologie de base de l'IA"
notions = """IA, ML, deep learning, réseaux de neurones, vision par ordinateur, NLP, modèle, \
algorithme, entraînement et inférence, biais, équité, surapprentissage et sous-apprentissage, LLM ; \
apprentissage supervisé, non supervisé, par renforcement ; données étiquetées ou non, tabulaires, \
séries temporelles, images, texte, structurées ou non ; inférence par lots ou en temps réel."""

[[domains.tasks]]
id = "1.2"
title = "Identifier des cas d'usage concrets de l'IA"
notions = """Quand l'IA apporte de la valeur et quand elle n'en apporte pas (coût, besoin d'un \
résultat exact plutôt que d'une prédiction) ; régression, classification, clustering ; vision, NLP, \
reconnaissance vocale, recommandation, détection de fraude, prévision ; ce que font les services \
gérés : SageMaker, Transcribe, Translate, Comprehend, Lex, Polly."""

[[domains.tasks]]
id = "1.3"
title = "Décrire le cycle de vie du développement ML"
notions = """Collecte, analyse exploratoire, préparation des données, ingénierie des \
caractéristiques, entraînement, réglage des hyperparamètres, évaluation, déploiement, surveillance ; \
modèles pré-entraînés open source ou entraînement sur mesure ; API gérée ou auto-hébergée ; \
SageMaker, Data Wrangler, Feature Store, Model Monitor ; MLOps (expérimentation, répétabilité, \
dette technique, ré-entraînement) ; métriques de modèle (exactitude, AUC, F1) et métriques métier \
(coût par utilisateur, coût de développement, retours clients, ROI)."""

[[domains]]
id = 2
name = "Fondamentaux de l'IA générative"
weight = 24

[[domains.tasks]]
id = "2.1"
title = "Expliquer les concepts de base de l'IA générative"
notions = """Tokens, découpage en morceaux (chunking), embeddings, vecteurs, ingénierie de prompt, \
LLM à base de transformeurs, modèles de fondation, modèles multimodaux, modèles de diffusion ; \
usages (génération d'images, de vidéo, d'audio, résumé, chatbots, traduction, génération de code, \
agents de service client, recherche, recommandation) ; cycle de vie d'un modèle de fondation \
(sélection des données et du modèle, pré-entraînement, ajustement fin, évaluation, déploiement, \
retours)."""

[[domains.tasks]]
id = "2.2"
title = "Comprendre les capacités et les limites de l'IA générative pour des problèmes métier"
notions = """Avantages (adaptabilité, réactivité, simplicité) ; limites (hallucinations, \
interprétabilité, inexactitude, non-déterminisme) ; critères de choix d'un modèle (type, \
performances, capacités, contraintes, conformité) ; valeur métier et indicateurs (performance \
inter-domaines, efficacité, taux de conversion, revenu moyen par utilisateur, exactitude, valeur \
vie client)."""

[[domains.tasks]]
id = "2.3"
title = "Décrire l'infrastructure et les technologies AWS pour construire des applications d'IA générative"
notions = """SageMaker JumpStart, Amazon Bedrock, PartyRock, Amazon Q ; avantages des services \
d'IA générative d'AWS (accessibilité, barrière d'entrée basse, efficacité, coût, délai de mise sur \
le marché) ; bénéfices de l'infrastructure AWS (sécurité, conformité, responsabilité, sûreté) ; \
arbitrages de coût (réactivité, disponibilité, redondance, performance, couverture régionale, \
tarification au token, débit provisionné, modèles personnalisés)."""

[[domains]]
id = 3
name = "Applications des modèles de fondation"
weight = 28

[[domains.tasks]]
id = "3.1"
title = "Décrire les choix de conception des applications qui utilisent des modèles de fondation"
notions = """Critères de choix d'un modèle pré-entraîné (coût, modalité, latence, multilinguisme, \
taille, complexité, personnalisation, longueur d'entrée et de sortie) ; effet des paramètres \
d'inférence (température, longueur d'entrée et de sortie) ; RAG et ses usages métier (Amazon \
Bedrock, bases de connaissances) ; stockage des embeddings dans des bases vectorielles (OpenSearch \
Service, Aurora, Neptune, DocumentDB, RDS for PostgreSQL) ; coût des approches de personnalisation \
(pré-entraînement, ajustement fin, apprentissage en contexte, RAG) ; rôle des agents dans les \
tâches en plusieurs étapes (Amazon Bedrock Agents)."""

[[domains.tasks]]
id = "3.2"
title = "Choisir des techniques d'ingénierie de prompt efficaces"
notions = """Contexte, instruction, prompts négatifs, espace latent du modèle ; chaîne de pensée, \
zero-shot, one-shot, few-shot, modèles de prompt ; bonnes pratiques (qualité des réponses, \
expérimentation, garde-fous, précision et concision) ; risques (exposition, empoisonnement, \
détournement, jailbreak, injection de prompt)."""

[[domains.tasks]]
id = "3.3"
title = "Décrire l'entraînement et l'ajustement fin des modèles de fondation"
notions = """Pré-entraînement, ajustement fin, pré-entraînement continu ; ajustement par \
instructions, adaptation à un domaine, apprentissage par transfert ; préparation des données \
(curation, gouvernance, taille, étiquetage, représentativité, RLHF)."""

[[domains.tasks]]
id = "3.4"
title = "Décrire les méthodes d'évaluation des modèles de fondation"
notions = """Évaluation humaine, jeux de données de référence (benchmarks), évaluation de modèles \
dans Amazon Bedrock ; métriques ROUGE, BLEU, BERTScore ; vérifier qu'un modèle sert les objectifs \
métier (productivité, engagement, ingénierie des tâches)."""

[[domains]]
id = 4
name = "Lignes directrices pour une IA responsable"
weight = 14

[[domains.tasks]]
id = "4.1"
title = "Expliquer le développement de systèmes d'IA responsables"
notions = """Biais, équité, inclusivité, robustesse, sûreté, véracité ; Amazon Bedrock Guardrails ; \
choix responsable d'un modèle (environnement, durabilité) ; risques juridiques (propriété \
intellectuelle, sorties biaisées, perte de confiance, hallucinations) ; jeux de données inclusifs, \
diversifiés, équilibrés, sources curées ; effets du biais et de la variance (groupes \
démographiques, surapprentissage, sous-apprentissage) ; détection et suivi (qualité des \
étiquettes, audits humains, analyse par sous-groupe, SageMaker Clarify, SageMaker Model Monitor, \
Amazon A2I)."""

[[domains.tasks]]
id = "4.2"
title = "Reconnaître l'importance de modèles transparents et explicables"
notions = """Modèles transparents et explicables ou non ; SageMaker Model Cards, modèles et \
données open source, licences ; arbitrage entre sûreté et transparence (interprétabilité contre \
performance) ; conception centrée sur l'humain pour une IA explicable."""

[[domains]]
id = 5
name = "Sécurité, conformité et gouvernance des solutions d'IA"
weight = 14

[[domains.tasks]]
id = "5.1"
title = "Expliquer comment sécuriser les systèmes d'IA"
notions = """Rôles, politiques et permissions IAM, chiffrement, Amazon Macie, AWS PrivateLink, \
modèle de responsabilité partagée ; citer les sources et documenter l'origine des données (lignage, \
catalogue, SageMaker Model Cards) ; ingénierie des données sécurisée (qualité, technologies de \
protection de la vie privée, contrôle d'accès, intégrité) ; sécurité applicative, détection des \
menaces, gestion des vulnérabilités, protection de l'infrastructure, injection de prompt, \
chiffrement au repos et en transit."""

[[domains.tasks]]
id = "5.2"
title = "Reconnaître les règles de gouvernance et de conformité des systèmes d'IA"
notions = """Normes (ISO, SOC, lois sur la responsabilité algorithmique) ; AWS Config, Amazon \
Inspector, AWS Audit Manager, AWS Artifact, AWS CloudTrail, AWS Trusted Advisor ; gouvernance des \
données (cycle de vie, journalisation, résidence, surveillance, conservation) ; protocoles de \
gouvernance (politiques, revues, cadres comme la Generative AI Security Scoping Matrix, normes de \
transparence, formation des équipes)."""
